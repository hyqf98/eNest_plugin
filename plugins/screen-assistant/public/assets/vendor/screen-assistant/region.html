<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>选择区域</title>
  <link rel="stylesheet" href="region.css">
  <script type="module" src="region.js"></script>
</head>
<body>
  <div id="veil" aria-hidden="true">
    <span id="mask-top"></span><span id="mask-bottom"></span><span id="mask-left"></span><span id="mask-right"></span>
  </div>
  <div id="selection" aria-hidden="true">
    <span class="handle" data-h="nw"></span><span class="handle" data-h="n"></span><span class="handle" data-h="ne"></span>
    <span class="handle" data-h="w"></span><span class="handle" data-h="e"></span>
    <span class="handle" data-h="sw"></span><span class="handle" data-h="s"></span><span class="handle" data-h="se"></span>
  </div>
  <span id="badge"></span>
  <template id="record-audio">
    <button type="button" class="tool audio" title="录制系统声音" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="wave" d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span>系统声音</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
  </template>
  <div id="tools" role="toolbar" aria-label="选区操作">
    <button type="button" id="cancel" class="tool" title="取消（Esc）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      <span>取消</span>
    </button>
    <button type="button" id="confirm" class="tool primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>
      <span id="confirm-label">确定</span>
    </button>
  </div>
  <div id="hint">拖动选择区域 · Enter 截取当前画面 · Esc 取消</div>
</body>
</html>
