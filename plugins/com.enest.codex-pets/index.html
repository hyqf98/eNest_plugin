<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 宠物市场</title>
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="cp" id="app">
      <header class="cp-top">
        <h1 class="cp-logo" title="codex-pets.net">🐾 Codex 宠物市场</h1>
        <nav class="cp-nav" id="nav" aria-label="页面">
          <button type="button" class="cp-nav-btn is-active" data-route="#/" title="画廊">画廊</button>
          <button type="button" class="cp-nav-btn" data-route="#/installed" title="已安装到本机 Codex">已安装</button>
        </nav>
        <div class="cp-spacer"></div>
        <a class="cp-origin" id="origin-link" href="https://codex-pets.net/" title="在浏览器打开原站">codex-pets.net ↗</a>
      </header>

      <section class="cp-body" id="body"><!-- JS 渲染 --></section>

      <footer class="cp-foot">
        <span id="foot-status">就绪</span>
        <span class="cp-foot-hint">数据来自 codex-pets.net 社区 · 安装目录 ~/.codex/pets</span>
      </footer>
    </main>

    <!-- 光标跟随宠物（画廊卡片 hover 触发） -->
    <div class="cp-cursor-pet" id="cursor-pet" aria-hidden="true"><div class="sprite"></div></div>

    <!-- 通用浮层宿主 -->
    <dialog id="dlg"></dialog>

    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
