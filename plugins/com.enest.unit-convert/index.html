<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>单位与汇率</title>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="uc">
      <nav class="tabs" id="tabs" role="tablist" aria-label="换算类目"></nav>

      <section class="pane" id="pane">
        <div class="rows" id="rows"></div>
        <div class="presets shell-only" id="presets"></div>
      </section>

      <section class="fx shell-only" id="fx-section" hidden>
        <div class="fx-head">
          <label>基准<select id="fx-base"></select></label>
          <label>金额<input id="fx-amount" class="mono" inputmode="decimal" value="1" /></label>
          <button id="fx-refresh">刷新汇率</button>
          <span id="fx-state" class="muted"></span>
        </div>
        <div class="rows" id="fx-rows"></div>
      </section>

      <section class="rmb shell-only" id="rmb-section" hidden>
        <div class="rmb-head">
          <span class="eyebrow">人民币大写 / 中文数字</span>
          <label>金额<input id="rmb-input" class="mono" inputmode="decimal" placeholder="如 1024.50" /></label>
        </div>
        <div class="rmb-results">
          <div class="rmb-row"><span class="cap">票据大写</span><span id="rmb-upper" class="mono">—</span><button data-copy-target="rmb-upper">复制</button></div>
          <div class="rmb-row"><span class="cap">中文数字</span><span id="rmb-cn" class="mono">—</span><button data-copy-target="rmb-cn">复制</button></div>
        </div>
      </section>

      <footer>
        <span id="foot-note"></span>
        <span class="grow"></span>
        <button id="copy-all" class="shell-only">复制全部结果</button>
      </footer>
    </main>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
