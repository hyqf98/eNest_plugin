<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JSON 工具</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="json-workspace">
      <header>
        <h1>JSON 工具</h1>
        <span id="stats">保留数字原始精度</span>
        <div class="quick-switch">
          <button id="show-source" aria-pressed="true">原文</button
          ><button id="show-result" aria-pressed="false">结果</button>
        </div>
      </header>
      <nav class="transforms" aria-label="JSON 操作">
        <button data-action="format">格式化</button
        ><select id="indent" aria-label="缩进">
          <option value="2">2 空格</option>
          <option value="4">4 空格</option></select
        ><button data-action="minify">压缩</button
        ><button data-action="check">校验</button
        ><button data-action="sort">键排序</button
        ><button data-action="escape">转义</button
        ><button data-action="unescape">反转义</button
        ><button id="paste">粘贴</button><button id="clear">清空</button>
      </nav>
      <div id="error" role="alert"></div>
      <section class="editors">
        <div class="source-pane">
          <div class="pane-head">
            <label for="input">原文</label><span id="input-size"></span>
          </div>
          <textarea
            id="input"
            spellcheck="false"
            placeholder='{"message": "粘贴 JSON 开始"}'
          ></textarea>
        </div>
        <div class="result-pane">
          <div class="pane-head">
            <nav>
              <button data-view="text" aria-pressed="true">文本</button
              ><button data-view="tree" aria-pressed="false">树</button
              ><button data-view="diff" aria-pressed="false">差异</button>
            </nav>
            <button id="copy">复制</button><button id="refill">回填</button
            ><button id="save">导出</button>
          </div>
          <div class="view text-view" data-content="text">
            <textarea
              id="output"
              readonly
              spellcheck="false"
              aria-label="JSON 结果"
              placeholder="格式化结果显示在这里"
            ></textarea>
          </div>
          <div class="view tree-view" data-content="tree" hidden>
            <div class="tree-toolbar">
              <input
                id="search"
                placeholder="搜索键、值或路径"
                aria-label="搜索 JSON 树"
              /><span id="search-count"></span>
            </div>
            <div id="tree"></div>
          </div>
          <div class="view diff-view" data-content="diff" hidden>
            <textarea
              id="compare"
              spellcheck="false"
              aria-label="比较 JSON"
              placeholder="粘贴另一份 JSON，与左侧原文比较"
            ></textarea>
            <div class="diff-actions">
              <button id="compare-run">比较</button
              ><button id="diff-copy">复制差异</button
              ><span>按路径比较；数字按原始 token 比较</span>
            </div>
            <div id="diff-results"></div>
          </div>
        </div>
      </section>
      <footer>
        <span id="result-size">离线处理 · 最大 8 MB</span
        ><span>⌘/Ctrl + Shift + Enter 格式化</span>
      </footer>
    </main>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
