<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Markdown 笔记</title>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="md-notes">
      <header>
        <div class="brand shell-only">
          <div class="eyebrow">写作、整理、找回</div>
          <h1>Markdown 笔记</h1>
        </div>
        <input id="search" class="search" type="search" placeholder="全文搜索标题与内容" aria-label="搜索笔记" />
        <span class="grow"></span>
        <button id="export-md" class="shell-only">导出 .md</button>
        <button id="export-html" class="shell-only">导出 .html</button>
        <button data-open-settings class="shell-only">设置</button>
      </header>

      <div class="workspace">
        <nav class="tree-pane shell-only">
          <div class="tree-head">
            <span class="eyebrow">分组</span>
            <button id="new-group" title="新建分组">＋</button>
          </div>
          <div id="groups" role="tree"></div>
          <div class="tree-head">
            <span class="eyebrow">笔记</span>
            <button id="new-note" title="新建笔记">＋</button>
          </div>
          <div id="notes-tree" role="tree"></div>
        </nav>

        <section class="editor-pane">
          <div class="editor-toolbar">
            <button data-wrap="**" title="加粗">B</button>
            <button data-wrap="*" title="斜体">I</button>
            <button data-line="#" title="标题">H</button>
            <button data-line="- " title="无序列表">•≡</button>
            <button data-line="1. " title="有序列表">1.</button>
            <button data-block="```\n\n```" title="代码块">‹›</button>
            <button data-block="| 列1 | 列2 |\n| --- | --- |\n|  |  |" title="表格">⊞</button>
            <button data-wrap="`" title="行内代码">`x`</button>
            <button data-line="- [ ] " title="任务清单">☑</button>
            <button id="attach-image" title="粘贴剪贴板图片为附件">🖼</button>
            <span class="grow"></span>
            <button id="toggle-preview" aria-pressed="false">预览</button>
          </div>
          <div class="editor-body">
            <textarea id="editor" spellcheck="false" placeholder="开始写…（Markdown 语法，自动保存）"></textarea>
            <div id="preview" class="preview md-render" hidden></div>
          </div>
          <div class="editor-status">
            <span id="save-state">已保存</span>
            <span id="editor-stats" class="muted"></span>
          </div>
        </section>
      </div>

      <footer>
        <span id="search-summary"></span>
      </footer>
    </main>



    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
