<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>计算器</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="calculator">
      <header>
        <h1>计算器</h1>
        <span class="sub">表达式工作台</span>
        <div class="toolbar">
          <button id="angle" aria-pressed="false">RAD</button
          ><button id="group-toggle" aria-pressed="true" title="结果千分位分组">千分位</button
          ><button id="toggle-pad" aria-expanded="false">键盘</button>
        </div>
      </header>
      <section class="workbench">
        <div class="calculation">
          <label for="expr" class="caption">表达式</label
          ><input
            id="expr"
            spellcheck="false"
            autocomplete="off"
            placeholder="输入表达式、x = 5 赋值或 200 × 10%"
            aria-label="计算表达式"
          />
          <div class="answer">
            <output id="result" aria-live="polite">即输即算</output
            ><button id="copy" disabled>复制结果</button>
          </div>
          <p class="status" id="status">
            Enter 记录 · x = 5 赋值变量 · 10% 百分比 · 10 % 3 取模
          </p>
          <nav class="memory" aria-label="记忆操作">
            <button data-insert="Ans">Ans</button
            ><button data-insert="M">MR</button
            ><button id="memory-add">M+</button
            ><button id="memory-clear">MC</button
            ><span id="memory-value">M = 0</span>
          </nav>
          <div id="keypad" class="keypad"></div>
          <div class="function-guide">
            <span>sqrt / pow / abs</span><span>sin / cos / tan</span
            ><span>ln / log / π / e / g</span>
          </div>
        </div>
        <aside class="history">
          <div class="history-head">
            <h2>计算记录</h2>
            <span id="history-count"></span><button id="export">导出</button
            ><button id="clear">清空未收藏</button>
          </div>
          <div class="filters">
            <input
              id="history-search"
              placeholder="搜索表达式或结果"
              aria-label="搜索记录"
            /><button id="favorites" aria-pressed="false">收藏</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </aside>
      </section>
      <footer>
        <span id="selection-hint">↑ ↓ 选择历史 · Enter 回填</span>
      </footer>
    </main>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
