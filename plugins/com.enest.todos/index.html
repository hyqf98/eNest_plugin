<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>待办清单</title>

    <style>
      :root {
        --line: var(--border, #dce2e6);
        --paper: var(--surface, #fff);
        --muted: var(--text-2, #73808c);
        --mark: var(--accent, #358472);
      }
      body {
        overflow: hidden;
      }
      button {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: inherit;
        padding: 7px 10px;
      }
      button:hover {
        background: var(--surface-2, #eaf0ef);
      }
      input,
      textarea,
      select {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--paper);
        color: inherit;
        padding: 8px;
        min-width: 0;
      }
      textarea {
        resize: vertical;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px 24px 14px;
      }
      h1 {
        font-size: 21px;
        letter-spacing: -0.6px;
        margin: 0;
      }
      header .grow {
        flex: 1;
      }
      .eyebrow {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .workspace {
        height: calc(100% - 83px);
        display: grid;
        grid-template-columns: 180px minmax(280px, 1fr) 285px;
      }
      nav {
        padding: 12px;
        border-right: 1px solid var(--line);
      }
      nav button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 3px 0;
      }
      button.active {
        background: color-mix(in srgb, var(--mark) 12%, transparent);
        color: var(--mark);
        font-weight: 600;
      }
      .list-pane {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .filters {
        display: flex;
        gap: 3px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        flex: none;
      }
      .composer {
        display: flex;
        gap: 8px;
        padding: 14px 18px;
      }
      .composer input {
        flex: 1;
        background: transparent;
      }
      .primary {
        background: var(--mark);
        color: #fff;
      }
      .primary:hover {
        filter: brightness(1.05);
        background: var(--mark);
      }
      #tasks {
        overflow: auto;
        flex: 1;
        padding: 0 12px;
      }
      .task {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 9px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        border-radius: 6px;
      }
      .task.selected {
        background: color-mix(in srgb, var(--mark) 9%, transparent);
        box-shadow: inset 3px 0 var(--mark);
      }
      .task.done .task-title {
        text-decoration: line-through;
        color: var(--muted);
      }
      .check {
        width: 20px;
        height: 20px;
        border: 1px solid var(--line);
        padding: 0;
        border-radius: 6px;
        flex: none;
      }
      .done .check {
        background: var(--mark);
        color: white;
      }
      .task-body {
        flex: 1;
        min-width: 0;
      }
      .task-title {
        overflow-wrap: anywhere;
        font-size: 14px;
      }
      .meta {
        display: flex;
        gap: 8px;
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .overdue {
        color: var(--danger, #b35350);
      }
      .pin {
        color: var(--mark);
      }
      .task .remove {
        opacity: 0;
      }
      .task:hover .remove,
      .task:focus-within .remove {
        opacity: 1;
      }
      .batch {
        padding: 7px 18px;
        display: flex;
        gap: 5px;
        border-top: 1px solid var(--line);
      }
      .detail {
        overflow: auto;
        border-left: 1px solid var(--line);
        padding: 18px;
      }
      .detail label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 13px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .detail input,
      .detail textarea,
      .detail select {
        width: 100%;
        color: var(--text, #252a32);
      }
      .detail h2 {
        font-size: 14px;
        margin: 0 0 15px;
      }
      .detail .subtask {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 7px 0;
      }
      .subtask input[type='checkbox'] {
        width: auto;
      }
      .subtask span {
        flex: 1;
        overflow-wrap: anywhere;
      }
      .detail-actions {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .empty {
        padding: 60px 18px;
        text-align: center;
        color: var(--muted);
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--muted);
        padding: 9px 18px;
        border-top: 1px solid var(--line);
      }
      #save-state {
        margin-left: auto;
      }
      .quick-summary {
        font-weight: 600;
        padding: 10px 18px 0;
      }
      .search {
        width: 220px;
      }
      #undo {
        color: var(--mark);
      }
      [data-mode='quick'] .workspace {
        height: 100%;
        grid-template-columns: 1fr;
      }
      [data-mode='quick'] .filters {
        padding: 5px 10px;
      }
      [data-mode='quick'] .composer {
        padding: 9px 12px;
      }
      [data-mode='quick'] .task {
        padding: 9px 8px;
      }
      [data-mode='quick'] .task-title {
        font-size: 13px;
      }
      [data-mode='quick'] .detail {
        position: absolute;
        inset: 0 0 0 30%;
        background: var(--paper);
        z-index: 5;
        box-shadow: -8px 0 30px #15202615;
      }
      [data-mode='quick'] .detail:not(.open) {
        display: none;
      }
      [data-mode='quick'] .batch {
        display: none;
      }
      @media (max-width: 900px) {
        [data-mode='shell'] .workspace {
          grid-template-columns: 145px 1fr;
        }
        [data-mode='shell'] .detail {
          position: absolute;
          right: 0;
          top: 80px;
          bottom: 0;
          width: 310px;
          background: var(--paper);
          z-index: 5;
        }
        [data-mode='shell'] .detail:not(.open) {
          display: none;
        }
      }
      @media (max-width: 540px) {
        [data-mode='quick'] .detail {
          left: 0;
        }
        .task .remove {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <header class="shell-only">
      <div>
        <div class="eyebrow">把下一步写下来</div>
        <h1>待办清单</h1>
      </div>
      <span class="grow"></span
      ><input
        class="search"
        id="search"
        type="search"
        placeholder="搜索任务、标签、备注"
        aria-label="搜索任务"
      /><button id="export">导出</button
      ><button data-open-settings>设置</button>
    </header>
    <div class="workspace">
      <nav class="shell-only">
        <div class="eyebrow">清单</div>
        <div id="lists"></div>
        <button id="new-list">＋ 新建清单</button>
        <form id="list-form" hidden>
          <input
            id="list-name"
            placeholder="清单名称"
            maxlength="50"
            aria-label="新清单名称"
            style="width: 100%"
          /><button>创建</button
          ><button type="button" id="cancel-list">取消</button>
        </form>
        <hr />
        <button id="import">导入任务</button
        >
      </nav>
      <section class="list-pane">
        <div class="quick-summary quick-only">
          待办清单 <span id="quick-count"></span>
        </div>
        <div class="filters" id="filters"></div>
        <form class="composer" id="composer">
          <input
            id="new-task"
            autocomplete="off"
            maxlength="500"
            placeholder="下一件要做的事…"
            aria-label="新任务"
          /><button class="primary" type="submit">添加</button>
        </form>
        <div id="tasks" role="list"></div>
        <div class="batch shell-only">
          <button id="batch-done">完成已选</button
          ><button id="batch-archive">归档已选</button
          ><button id="clear-done">归档已完成</button>
        </div>
        <footer>
          <span id="count"></span><button id="undo" hidden>撤销</button
          ><span id="save-state">已保存</span>
        </footer>
      </section>
      <aside class="detail" id="detail">
        <div class="empty">选择任务，安排下一步</div>
      </aside>
    </div>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
