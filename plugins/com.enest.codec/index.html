<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>编解码</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="codec">
      <header>
        <h1>编解码</h1>
        <nav id="modes" aria-label="转换类型"></nav>
      </header>
      <div class="operation-bar">
        <button id="direction">编码 →</button
        ><label><input id="live" type="checkbox" checked /> 即时转换</label
        ><label><input id="batch" type="checkbox" /> 逐行处理</label
        ><span id="mode-help"></span><button id="run">执行</button>
      </div>
      <section class="panes">
        <div class="pane source">
          <div class="pane-head">
            <label for="input">输入</label><span id="in-size"></span
            ><button id="paste">粘贴</button><button id="clear">清空</button>
          </div>
          <textarea
            id="input"
            spellcheck="false"
            placeholder="输入或粘贴需要转换的内容"
          ></textarea>
        </div>
        <div class="pane target">
          <div class="pane-head">
            <label for="output">结果</label><span id="out-size"></span
            ><button id="swap">回填并反转</button
            ><button id="copy" disabled>复制</button
            ><button id="save" disabled>导出</button>
          </div>
          <textarea
            id="output"
            readonly
            spellcheck="false"
            placeholder="转换结果"
            aria-live="polite"
          ></textarea>
        </div>
      </section>
      <div id="error" role="alert"></div>
      <footer>
        <span id="status">所有转换均在本地完成</span
        ><span>⌘/Ctrl + Shift + Enter 执行</span>
      </footer>
    </main>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
