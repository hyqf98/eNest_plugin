<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>屏幕助手</title>
    <style>
      /* 深色兜底 token：宿主 themeAware 注入会覆盖（PluginHost → resolveThemeTokens） */
      :root {
        color-scheme: dark;
        --bg: #0f141a;
        --surface: #151b23;
        --surface-2: #1b2330;
        --surface-3: #232d3d;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #e8eef7;
        --text-2: #97a4b6;
        --text-3: #66738a;
        --accent: #38bdf8;
        --accent-contrast: #06121c;
        --accent-soft: rgba(56, 189, 248, 0.14);
        --ok: #3dd68c;
        --danger: #ff6b7a;
        --danger-soft: rgba(255, 107, 122, 0.14);
        --border-dashed: var(--border-strong);
        /* 节奏 */
        --t: 140ms;
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --r-lg: 12px;
        --r-md: 10px;
        --r-sm: 8px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--accent-soft); }
      button { font: inherit; }
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent);
        outline-offset: 2px;
      }

      .app {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        height: 100%;
        min-height: 0;
      }

      /* —— 顶栏 —— */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px 12px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .status {
        font-size: 12px;
        color: var(--text-3);
        max-width: 55%;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-variant-numeric: tabular-nums;
      }
      .status.rec { color: var(--danger); font-weight: 600; }

      /* —— 分段页签 —— */
      .tabs { padding: 12px 20px 0; }
      .seg {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
      }
      .seg button {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text-2);
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
        cursor: pointer;
        transition: color var(--t) var(--ease), background-color var(--t) var(--ease),
          border-color var(--t) var(--ease);
      }
      .seg button:hover { color: var(--text); }
      .seg button.active {
        background: var(--accent-soft);
        border-color: color-mix(in srgb, var(--accent) 40%, transparent);
        color: var(--text);
      }

      /* —— 内容面板 —— */
      main { min-height: 0; overflow: hidden; }
      .panel {
        display: none;
        height: 100%;
        padding: 16px 20px 24px;
        overflow-y: auto;
        min-height: 0;
      }
      .panel.active { display: block; }
      .panel::-webkit-scrollbar { width: 10px; }
      .panel::-webkit-scrollbar-thumb {
        background: var(--surface-3);
        border-radius: 5px;
        border: 3px solid var(--bg);
      }

      .hint {
        font-size: 12px;
        color: var(--text-3);
        line-height: 1.6;
        margin-bottom: 16px;
        max-width: 62ch;
      }
      .hint code {
        font-family: var(--mono);
        font-size: 11px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 5px;
        color: var(--text-2);
      }

      /* —— 按钮体系 —— */
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .row .spacer { flex: 1; }
      .btn {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid transparent;
        background: var(--surface-2);
        color: var(--text-2);
        padding: 8px 14px;
        border-radius: 9px;
        font-size: 13px;
        cursor: pointer;
        transition: color var(--t) var(--ease), background-color var(--t) var(--ease),
          border-color var(--t) var(--ease), transform var(--t) var(--ease);
      }
      .btn:not(:disabled):hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .btn:not(:disabled):active { transform: scale(0.98); }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 6px 16px -8px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .btn.primary:not(:disabled):hover {
        border-color: transparent;
        filter: brightness(1.06);
        color: var(--accent-contrast);
      }
      .btn.danger-outline {
        background: transparent;
        border-color: color-mix(in srgb, var(--danger) 45%, transparent);
        color: var(--danger);
      }
      .btn.danger-outline:not(:disabled):hover {
        background: var(--danger-soft);
        border-color: color-mix(in srgb, var(--danger) 65%, transparent);
        color: var(--danger);
      }
      .btn.ghost { background: transparent; color: var(--text-3); }
      .btn.ghost:not(:disabled):hover { background: var(--surface-2); color: var(--text-2); }
      .btn.small { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      /* —— 截图预览 —— */
      .preview {
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        min-height: 200px;
        display: grid;
        place-items: center;
        background: var(--surface);
        overflow: hidden;
        padding: 12px;
      }
      .preview img {
        max-width: 100%;
        max-height: 300px;
        display: block;
        border-radius: var(--r-sm);
        box-shadow: 0 10px 28px -14px rgba(3, 10, 22, 0.6);
      }

      /* —— 录屏台 —— */
      .rec-stage {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin-bottom: 16px;
        transition: border-color var(--t) var(--ease);
      }
      .rec-stage.recording { border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
      .rec-head {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--text-2);
        letter-spacing: 0.05em;
      }
      .rec-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-3);
        opacity: 0.6;
      }
      .rec-stage.recording .rec-dot {
        background: var(--danger);
        opacity: 1;
        animation: rec-pulse 1.2s ease-in-out infinite;
      }
      .rec-timer {
        font-family: var(--mono);
        font-size: 32px;
        font-weight: 500;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        line-height: 1.2;
      }
      .rec-info {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-3);
        line-height: 1.6;
        word-break: break-all;
        text-align: center;
        max-width: 100%;
      }
      .rec-info:empty { display: none; }
      @keyframes rec-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-2);
        user-select: none;
        cursor: pointer;
      }
      .check input[type="checkbox"] {
        appearance: none;
        width: 16px;
        height: 16px;
        margin: 0;
        border: 1px solid var(--border-strong);
        border-radius: 5px;
        background: var(--surface-2);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease);
      }
      .check input[type="checkbox"]::after {
        content: "";
        width: 4px;
        height: 8px;
        border-right: 1.5px solid var(--accent-contrast);
        border-bottom: 1.5px solid var(--accent-contrast);
        transform: rotate(45deg) translate(-0.5px, -1px);
        opacity: 0;
        transition: opacity var(--t) var(--ease);
      }
      .check input[type="checkbox"]:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .check input[type="checkbox"]:checked::after { opacity: 1; }

      /* —— 贴图三入口卡 —— */
      .entries {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .entry {
        appearance: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        cursor: pointer;
        transition: border-color var(--t) var(--ease), transform var(--t) var(--ease),
          background-color var(--t) var(--ease);
      }
      .entry:not(:disabled):hover {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        background: color-mix(in srgb, var(--surface-2) 55%, var(--surface));
        transform: translateY(-1px);
      }
      .entry:not(:disabled):active { transform: translateY(0) scale(0.99); }
      .entry-icon {
        width: 48px;
        height: 48px;
        display: block;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .entry-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.01em;
      }
      .entry-desc {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-3);
      }

      /* —— 区块标题 —— */
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 24px 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--text-2);
      }

      /* —— 贴图管理行 —— */
      .pin-list { display: flex; flex-direction: column; gap: 8px; }
      .pin-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--surface);
        transition: border-color var(--t) var(--ease);
      }
      .pin-row:hover { border-color: var(--border-strong); }
      .pin-idx {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--surface-3);
        color: var(--text-2);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        line-height: 20px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .pin-code {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.02em;
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* —— 最近（历史缩略卡） —— */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .card {
        position: relative;
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--surface);
        cursor: pointer;
        transition: border-color var(--t) var(--ease);
      }
      .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
      .thumb {
        position: relative;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: color-mix(in srgb, var(--bg) 80%, #000);
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1);
        transition: transform var(--t) var(--ease);
      }
      .card:hover .thumb img { transform: scale(1.02); }
      .thumb::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(4, 8, 15, 0.55);
        opacity: 0;
        transition: opacity var(--t) var(--ease);
        z-index: 1;
      }
      .card:hover .thumb::before { opacity: 1; }
      .pin-cta {
        appearance: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
        background: color-mix(in srgb, var(--accent) 18%, rgba(6, 12, 22, 0.85));
        color: var(--accent);
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        cursor: pointer;
        opacity: 0;
        transition: opacity var(--t) var(--ease), background-color var(--t) var(--ease),
          color var(--t) var(--ease);
      }
      .card:hover .pin-cta { opacity: 1; }
      .pin-cta:hover { background: var(--accent); color: var(--accent-contrast); }
      .card .meta {
        padding: 7px 10px 8px;
        font-size: 11px;
        color: var(--text-3);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* —— 空态 —— */
      .empty {
        grid-column: 1 / -1;
        padding: 28px 16px;
        text-align: center;
        font-size: 12px;
        color: var(--text-3);
        border: 1px dashed var(--border-dashed);
        border-radius: var(--r-lg);
        background: color-mix(in srgb, var(--surface) 55%, transparent);
      }

      footer {
        border-top: 1px solid var(--border);
        padding: 10px 20px;
        font-size: 11px;
        color: var(--text-3);
      }

      /* —— 窄容器（≤740px，Quick 呼出）降级 —— */
      @media (max-width: 740px) {
        header { padding: 12px 14px 10px; }
        .tabs { padding: 10px 14px 0; }
        .panel { padding: 14px 14px 20px; }
        .entries { grid-template-columns: 1fr; gap: 10px; }
        .entry { padding: 14px; }
        .entry-icon { width: 40px; height: 40px; margin-bottom: 10px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .preview { min-height: 150px; }
        .preview img { max-height: 220px; }
        .rec-timer { font-size: 26px; }
        .hint { margin-bottom: 12px; }
        .section-title { margin: 20px 0 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>屏幕助手</h1>
        <div class="status" id="status">就绪</div>
      </header>
      <nav class="tabs">
        <div class="seg" role="tablist" aria-label="功能页签">
          <button type="button" role="tab" aria-selected="true" data-tab="capture" class="active">截图</button>
          <button type="button" role="tab" aria-selected="false" data-tab="record">录屏</button>
          <button type="button" role="tab" aria-selected="false" data-tab="pin">贴图</button>
          <button type="button" role="tab" aria-selected="false" data-tab="gallery">最近</button>
        </div>
      </nav>
      <main>
        <section class="panel active" id="panel-capture" role="tabpanel">
          <div class="hint">
            点击「矩形截图」后全屏选区；完成后可复制到剪贴板或贴到屏幕。
          </div>
          <div class="row">
            <button type="button" class="btn primary" id="btn-capture">矩形截图</button>
            <button type="button" class="btn" id="btn-full">全屏截图</button>
            <span class="spacer"></span>
            <button type="button" class="btn" id="btn-copy" disabled>复制图片</button>
            <button type="button" class="btn" id="btn-pin" disabled>贴到屏幕</button>
          </div>
          <div class="preview" id="shot-preview"><div class="empty">尚无截图</div></div>
        </section>
        <section class="panel" id="panel-record" role="tabpanel">
          <div class="hint">
            选择区域后开始录制；停止后文件保存在 <code>~/eNest/recordings/</code>。
            系统音频受操作系统权限限制，不可用时将自动降级为无声。
          </div>
          <div class="rec-stage" id="rec-stage">
            <div class="rec-head">
              <span class="rec-dot"></span>
              <span class="rec-label" id="rec-label">待机</span>
            </div>
            <div class="rec-timer" id="rec-timer">00:00</div>
            <div class="rec-info" id="rec-info"></div>
          </div>
          <div class="row">
            <button type="button" class="btn primary" id="btn-rec-start">选择区域并开始</button>
            <button type="button" class="btn danger-outline" id="btn-rec-stop" disabled>停止</button>
            <button type="button" class="btn ghost" id="btn-rec-cancel" disabled>取消</button>
          </div>
          <label class="check">
            <input type="checkbox" id="chk-audio" />
            <span>录入声音</span>
          </label>
        </section>
        <section class="panel" id="panel-pin" role="tabpanel">
          <div class="hint">
            贴图会以悬浮窗形式钉在屏幕最前；支持从截图、剪贴板或本地图片三个入口创建。
          </div>
          <div class="entries">
            <button type="button" class="entry" id="btn-pin-shot">
              <svg class="entry-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="6" />
                <circle cx="12" cy="36" r="6" />
                <path d="M40 8 L16.24 31.76" />
                <path d="M28.94 28.96 L40 40" />
                <path d="M16.24 16.24 L24 24" />
              </svg>
              <span class="entry-title">截图贴</span>
              <span class="entry-desc">框选一块屏幕区域，截下后直接钉在最前</span>
            </button>
            <button type="button" class="entry" id="btn-pin-clip">
              <svg class="entry-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="13" y="9" width="22" height="33" rx="4" />
                <rect x="19" y="5" width="10" height="8" rx="2" />
                <path d="M19 23h10" />
                <path d="M19 30h7" />
              </svg>
              <span class="entry-title">剪贴板贴</span>
              <span class="entry-desc">把复制到剪贴板的图片一键贴出</span>
            </button>
            <button type="button" class="entry" id="btn-pin-file">
              <svg class="entry-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="32" height="32" rx="5" />
                <circle cx="18" cy="18" r="2.75" />
                <path d="M11 34 L20.5 24.5 L27.5 31.5 L32.5 26.5 L37.5 31.5" />
              </svg>
              <span class="entry-title">本地文件贴</span>
              <span class="entry-desc">选择 PNG · JPEG · WebP 图片贴到屏幕</span>
            </button>
          </div>
          <input type="file" id="file-pin" accept="image/png,image/jpeg,image/webp" hidden />
          <div class="section-title">
            <span>贴图管理</span>
            <button type="button" class="btn small danger-outline" id="btn-pin-closeall" disabled>全部关闭</button>
          </div>
          <div class="pin-list" id="pin-list"><div class="empty">暂无贴图</div></div>
        </section>
        <section class="panel" id="panel-gallery" role="tabpanel">
          <div class="hint">本次会话与最近历史的截图（历史为压缩缩略图），点击可贴到屏幕。</div>
          <div class="grid" id="gallery"></div>
        </section>
      </main>
      <footer id="footer">权限不足时请在市场详情中确认插件能力声明。</footer>
    </div>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
