<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>验证器</title>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="totp">
      <header>
        <div class="brand shell-only">
          <div class="eyebrow">两步验证，一瞥即得</div>
          <h1>验证器</h1>
        </div>
        <input id="search" class="search" type="search" placeholder="搜索账号或签发方" aria-label="搜索账号" />
        <span class="grow"></span>
        <button id="paste-uri" class="quick-only">读剪贴板导入</button>
        <button id="add">添加</button>
        <button id="backup" class="shell-only">备份</button>
        <button id="restore" class="shell-only">恢复</button>

      </header>

      <section class="list" id="list" role="list"></section>

      <footer>
        <span id="count"></span>
        <span class="grow"></span>
        <span class="muted shell-only">密钥以明文保存在本机 · 备份使用口令加密</span>
      </footer>
    </main>

    <dialog id="editor">
      <form id="editor-form" method="dialog">
        <h2 id="editor-title">添加验证器</h2>
        <div class="row">
          <label>账号名<input id="f-account" maxlength="80" required placeholder="如 me@example.com" /></label>
          <label>签发方<input id="f-issuer" maxlength="60" placeholder="如 GitHub" /></label>
        </div>
        <label>secret（base32）<input id="f-secret" required spellcheck="false" placeholder="JBSWY3DPEHPK3PXP" class="mono" /></label>
        <div class="row row3">
          <label>位数<select id="f-digits"><option value="6">6</option><option value="8">8</option></select></label>
          <label>周期<select id="f-period"><option value="30">30 秒</option><option value="60">60 秒</option></select></label>
          <label>算法<select id="f-algo"><option value="SHA1">SHA1</option><option value="SHA256">SHA256</option><option value="SHA512">SHA512</option></select></label>
        </div>
        <label>分组<input id="f-group" maxlength="40" list="group-options" placeholder="默认" /></label>
        <datalist id="group-options"></datalist>
        <p class="form-error" id="editor-error" hidden></p>
        <div class="actions">
          <button type="button" id="editor-cancel">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="backup-dialog">
      <form id="backup-form" method="dialog">
        <h2 id="backup-title">加密备份</h2>
        <p class="muted">使用口令经 PBKDF2 派生密钥（AES-GCM）加密；恢复时需同一口令。口令不会存储。</p>
        <label id="backup-pass-label">口令<input id="backup-pass" type="password" required minlength="6" placeholder="至少 6 位" /></label>
        <p class="form-error" id="backup-error" hidden></p>
        <div class="actions">
          <button type="button" id="backup-cancel">取消</button>
          <button type="submit" class="primary" id="backup-go">导出加密文件</button>
        </div>
      </form>
    </dialog>



    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
