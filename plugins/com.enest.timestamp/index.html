<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>时间戳</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="time-studio">
      <header>
        <h1>时间戳</h1>
        <nav>
          <button data-tab="convert" aria-pressed="true">转换</button
          ><button data-tab="batch" aria-pressed="false">批量</button
          ><button data-tab="date" aria-pressed="false">日期计算</button>
        </nav>
        <button id="pause" aria-pressed="false">暂停时钟</button>
      </header>
      <div class="workspace">
        <section class="clock-panel">
          <p class="eyebrow">当前时间</p>
          <time id="clock"></time>
          <div id="clock-zone"></div>
          <div class="now-values">
            <button id="copy-now-s"></button><button id="copy-now-ms"></button>
          </div>
          <button id="use-now">使用现在</button>
          <div class="world">
            <p class="eyebrow">时区速览</p>
            <div id="world-clocks"></div>
          </div>
        </section>
        <section class="converter" data-page="convert">
          <div class="query">
            <label class="eyebrow" for="input">时间戳 / 日期 / 相对时间</label
            ><input
              id="input"
              placeholder="例如 1720000000、2026-10-13 09:30、+2h"
              autocomplete="off"
            />
            <div class="options">
              <label
                >单位
                <select id="unit">
                  <option value="auto">自动</option>
                  <option value="s">秒</option>
                  <option value="ms">毫秒</option>
                </select></label
              ><label
                >时区
                <input
                  id="zone"
                  list="zones"
                  aria-label="时区"
                  value="Asia/Shanghai"
              /></label>
            </div>
            <div class="presets">
              <button data-relative="-1h">一小时前</button
              ><button data-relative="+30m">半小时后</button
              ><button data-relative="+1d">一天后</button>
            </div>
            <p id="error" role="alert"></p>
          </div>
          <div id="results" class="results"></div>
          <p class="note">
            自动单位：绝对值小于 1000 亿按秒，其余按毫秒；可手动覆盖。
          </p>
        </section>
        <section class="batch" data-page="batch" hidden>
          <div class="section-title">
            <h2>逐行转换</h2>
            <select id="batch-format" aria-label="输出格式">
              <option value="date">所选时区日期</option>
              <option value="iso">ISO UTC</option>
              <option value="s">Unix 秒</option>
              <option value="ms">Unix 毫秒</option>
            </select>
          </div>
          <textarea
            id="batch-input"
            placeholder="每行一个时间戳或日期，沿用转换页的单位和时区"
            aria-label="批量输入"
          ></textarea>
          <div class="actions">
            <button id="batch-run">转换</button
            ><button id="batch-copy">复制结果</button
            ><button id="batch-save">导出 TSV</button>
          </div>
          <pre id="batch-output" aria-live="polite"></pre>
        </section>
        <section class="date-math" data-page="date" hidden>
          <h2>时间差与日期加减</h2>
          <label
            >起点<input
              id="date-start"
              placeholder="2026-10-13 09:00:00" /></label
          ><label
            >终点<input
              id="date-end"
              placeholder="2026-10-14 18:30:00" /></label
          ><button id="date-diff">计算时间差</button
          ><output id="date-result" aria-live="polite"></output>
          <hr />
          <label
            >从起点偏移<input
              id="date-offset"
              value="+1d"
              placeholder="+1d / -2h / +30m" /></label
          ><button id="date-add">计算偏移</button
          ><button id="date-copy">复制计算结果</button>
          <p class="note">日期计算按所选时区解析；1 天为精确 24 小时。</p>
        </section>
      </div>
      <footer>
        <span id="live-state">时钟运行中</span
        ><span>点击结果行复制 · ↑ ↓ 选择 · Enter 复制</span>
      </footer>
    </main>
    <datalist id="zones">
      <option value="Asia/Shanghai"></option>
      <option value="UTC"></option>
      <option value="Asia/Tokyo"></option>
      <option value="America/New_York"></option>
      <option value="Europe/London"></option>
      <option value="Europe/Berlin"></option>
      <option value="Australia/Sydney"></option>
    </datalist>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
