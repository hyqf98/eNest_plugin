<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cron 工具</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="cron-app">
      <header class="topbar">
        <h1>Cron 工具</h1>
        <span class="sub">五域构建 · 自然语言 · 执行预览</span>
        <div class="toolbar">
          <div class="segmented" id="seconds-switch" role="group" aria-label="域模式">
            <button id="mode-5" class="active" aria-pressed="true">5 域</button
            ><button id="mode-6" aria-pressed="false">6 域（秒）</button>
          </div>
          <button id="toggle-presets" class="ghost shell-only">预设库</button>
        </div>
      </header>

      <section class="workbench">
        <!-- 预设库侧栏（桌面形态） -->
        <aside class="presets shell-only" id="presets" aria-label="预设库">
          <div class="presets-head">
            <h2>预设库</h2>
            <span class="hint" id="preset-source">内置</span>
          </div>
          <ul id="preset-list" class="preset-list"></ul>
          <div class="presets-foot">
            <button id="preset-save" disabled>保存当前为预设</button>
            <button id="preset-reset" class="ghost">恢复内置</button>
          </div>
        </aside>

        <section class="builder">
          <!-- 表达式行 -->
          <div class="field">
            <label for="expression">Cron 表达式</label>
            <div class="expr-row">
              <input id="expression" class="mono" spellcheck="false" placeholder="*/5 * * * *" />
              <button id="copy-expression" class="ghost" disabled>复制</button>
            </div>
            <div id="expr-error" class="error-bar" role="alert" hidden></div>
            <p id="humanize" class="humanize"></p>
          </div>

          <!-- 五/六域构建器 -->
          <div id="fields" class="fields"></div>

          <!-- 未来执行预览 -->
          <section class="panel">
            <div class="panel-head">
              <h2>未来执行 <span id="upcoming-count" class="mono"></span></h2>
              <div class="preview-controls">
                <div class="segmented compact" id="count-switch" role="group" aria-label="预览次数">
                  <button data-count="5" aria-pressed="false">5 次</button
                  ><button data-count="10" class="active" aria-pressed="true">10 次</button
                  ><button data-count="20" aria-pressed="false">20 次</button>
                </div>
                <select id="timezone" aria-label="预览时区">
                  <option value="local">本地时区</option>
                  <option value="UTC">UTC</option>
                </select>
              </div>
            </div>
            <div class="table-wrap">
              <table class="fire-table">
                <thead>
                  <tr><th class="idx">#</th><th id="tz-label">本地时间</th><th id="tz-alt-label">UTC 对照</th><th class="rel-head">相对</th></tr>
                </thead>
                <tbody id="fire-list"></tbody>
              </table>
            </div>
          </section>

          <!-- crontab 粘贴 / 导出 -->
          <section class="panel crontab-panel">
            <h2>crontab 行</h2>
            <div class="crontab-row">
              <textarea id="crontab" rows="3" class="mono" spellcheck="false" placeholder="粘贴 crontab 行，支持 @daily / @hourly 等宏；每行一条，# 开头为注释"></textarea>
            </div>
            <div class="crontab-foot">
              <span id="crontab-status" class="hint"></span>
              <span class="spacer"></span>
              <button id="crontab-parse">解析到构建器</button>
              <button id="crontab-export" disabled>导出复制</button>
            </div>
          </section>
        </section>
      </section>
    </main>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
