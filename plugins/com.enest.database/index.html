<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数据库</title>
    <link rel="stylesheet" href="src/css/main.css" />

    <link rel="stylesheet" href="src/css/workbench.css" />
    <link rel="stylesheet" href="src/css/workspace.css" />
    <link rel="stylesheet" href="src/css/productivity.css" />
    <link rel="stylesheet" href="src/css/gridProductivity.css" />
    <link rel="stylesheet" href="src/css/dataOperations.css" />
    <link rel="stylesheet" href="src/css/sqlIntelligence.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- 单条 chrome：侧栏开关 + 查询 Tab + 连接状态 + ⋯ -->
      <div class="workspace">
        <aside class="side" id="side"></aside>
        <div class="resizer left" id="resizer-left"></div>

        <div class="mid-col">
          <div class="mid-chrome">
            <button type="button" class="btn icon" id="side-toggle" title="展开/收起侧栏" aria-label="展开/收起侧栏" data-tip="展开/收起侧栏">≡</button>
            <div class="sql-tabs" id="editor-tabs" hidden></div>
            <div class="workspace-tabs" id="workspace-tabs" role="tablist" aria-label="工作标签"></div>
            <button type="button" class="btn icon" data-wb="newQuery" aria-label="新建查询" title="新建查询">＋</button>
            <button type="button" class="btn icon" data-wb="tabs" aria-label="所有标签" title="所有标签">⌄</button>
            <button type="button" class="btn" data-wb="openShell" hidden>桌面继续</button>
            <div class="mid-chip" id="toolbar"></div>
            <div class="spacer"></div>
            <button type="button" class="btn icon" id="top-more" title="更多操作" aria-label="更多操作" data-tip="更多操作">⋯</button>
          </div>
          <div class="query-surface" id="query-surface" role="tabpanel">
          <div class="editor-pane">
            <div class="editor-host" id="editor-host"></div>
            <div class="fab-dock" id="fab-dock">
              <button type="button" class="fab-execute" id="fab-run" title="执行当前语句" aria-label="执行当前语句" data-tip="执行当前语句">▶</button>
            </div>
          </div>
          <div class="resizer bottom" id="resizer-bottom" hidden></div>
          <div class="results" id="results" hidden></div>
          </div>
        </div>

        <div class="resizer right" id="resizer-right"></div>
        <aside class="right-panel" id="right-panel" hidden></aside>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="local-toast" hidden></div>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
