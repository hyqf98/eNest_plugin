<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>取色器</title>

  <link rel="stylesheet" href="./src/css/main.css" />
</head>
<body>
  <main class="color-app">
    <header class="app-head"><div><span class="eyebrow">颜色工作台</span><h1>取色器</h1></div><span id="status" role="status">选取颜色或输入色值</span><button id="capture" class="primary">屏幕取色</button><button id="open-image" class="desktop">从图片取色</button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden /></header>
    <div class="color-layout">
      <section class="current-panel" aria-label="颜色换算">
        <div class="color-preview checker"><div id="swatch"></div><span id="swatch-label">#447766</span></div>
        <div class="current-body">
          <label class="field-label" for="color-input">输入颜色</label>
          <div class="input-row"><input id="color-input" value="#447766" spellcheck="false" autocomplete="off" aria-describedby="input-error" placeholder="HEX、RGB(A) 或 HSL(A)" /><button id="remember">收录</button></div>
          <p id="input-error" class="error" role="alert" hidden>请输入有效的 HEX、RGB(A) 或 HSL(A)</p>
          <label class="alpha-row" for="alpha"><span>透明度</span><input id="alpha" type="range" min="0" max="100" value="100" /><output id="alpha-value">100%</output></label>
          <div class="formats" aria-label="点击复制颜色格式">
            <button data-format="hex"><span>HEX</span><code id="value-hex"></code><small>复制</small></button>
            <button data-format="rgb"><span>RGB</span><code id="value-rgb"></code><small>复制</small></button>
            <button data-format="hsl"><span>HSL</span><code id="value-hsl"></code><small>复制</small></button>
          </div>
        </div>
        <section class="recent-panel"><div class="section-head"><h2>最近颜色</h2><span id="recent-count"></span><button id="clear-history" class="text-button">清空</button></div><div id="recent-colors" class="recent-colors"></div></section>
      </section>
      <section class="picker-panel" id="picker-panel" data-input-context="overlay" hidden aria-label="截图取色">
        <div class="section-head"><h2>像素取色</h2><button id="stop-pick">完成取色</button></div>
        <p class="helper">移动鼠标预览，点击收录。聚焦截图后可用方向键微调，Enter 确认。</p>
        <div class="shot-scroll"><canvas id="shot" tabindex="0" aria-label="截图取色画布，方向键移动取样点，Enter 收录"></canvas></div>
        <div class="sample-row"><canvas id="magnifier" width="110" height="110" aria-label="取样点放大镜"></canvas><div><code id="sample-value">移入图片选取颜色</code><p id="sample-position" class="helper"></p><button id="confirm-pick" disabled>收录此色</button></div></div>
      </section>
      <div class="desktop-panels">
        <section class="contrast-panel"><div class="section-head"><h2>对比度检查</h2><span>WCAG 2</span></div><p class="helper">当前颜色作为文字色；透明颜色按白色底板合成。</p><label class="field-label" for="background">背景颜色</label><div class="input-row"><input id="background" value="#FFFFFF" spellcheck="false" /><button id="swap">交换</button></div><p class="error" id="background-error" hidden>背景色格式无效</p><div id="contrast-preview"><span>Aa</span><p>读起来清楚，才是好颜色。</p></div><div class="contrast-result"><strong id="contrast-ratio">0.00:1</strong><span id="contrast-summary"></span></div><div class="contrast-checks"><span id="aa-normal"></span><span id="aa-large"></span><span id="aaa-normal"></span></div></section>
        <section class="palette-panel"><div class="section-head"><h2>命名色板</h2><span id="palette-count"></span></div><label class="field-label" for="palette-select">当前色板</label><div class="input-row"><select id="palette-select"></select><button id="delete-palette" class="text-button danger">删除</button></div><div class="input-row create-row"><input id="palette-name" maxlength="40" placeholder="新色板名称" aria-label="新色板名称" /><button id="create-palette">新建</button></div><div class="input-row create-row"><input id="color-name" maxlength="40" placeholder="当前颜色名称（可选）" aria-label="颜色名称" /><button id="add-color">添加当前色</button></div><div id="palette-colors" class="palette-colors"></div><div class="export-row"><button id="export-css">导出 CSS</button><button id="export-json">导出 JSON</button><button id="import-palette">导入 JSON</button><input id="palette-file" type="file" accept="application/json,.json" hidden /></div><p class="helper">修改颜色名称会自动保存，点击色值按默认格式复制。</p></section>
      </div>
    </div>
    <footer><span id="mode-hint">输入颜色后 Enter 复制</span><button class="text-button" data-open-settings>取色设置</button></footer>
  </main>



  <script type="module" src="./src/entry.js"></script>
  </body>
</html>
