<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>取色器</title>
    <style>
      /* ============ 0. Token 体系 ============
         中性 token 跟随壳子 themeAware 注入同名变量，此处仅为注入前的
         本地回退（取自壳子暗色预设）。--brand 为插件身份色琥珀 #f5a524：
         只出现在主 CTA、确认按钮、复制成功与当前色高亮。禁纯黑、禁渐变横幅。 */
      :root {
        --bg: #17191b;
        --surface: #202326;
        --surface-2: #292d31;
        --surface-3: #33383d;
        --border: rgba(242, 243, 243, 0.09);
        --border-strong: rgba(242, 243, 243, 0.16);
        --text: #f2f3f3;
        --text-2: #adb3b8;
        --text-3: #7e878f;
        --ok: #77bfa4;
        --danger: #e79589;
        --brand: #f5a524;
        --brand-ink: #221602;

        --r-lg: 14px;
        --r-md: 10px;
        --r-sm: 7px;
        --r-full: 999px;

        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --t-fast: 140ms;

        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

        /* 形态因子（容器查询分档覆盖） */
        --shell-pad: 12px;
        --pane-gap: 12px;
        --shot-min-h: 176px;
      }

      * { box-sizing: border-box; }
      html { scrollbar-width: thin; }
      html[data-theme] ::-webkit-scrollbar { width: 6px; height: 6px; }
      html[data-theme] ::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--text-3) 36%, transparent);
        border-radius: var(--r-full);
      }
      html[data-theme] ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-3) 56%, transparent); }
      html[data-theme] ::-webkit-scrollbar-track { background: transparent; }

      body {
        margin: 0;
        font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body[data-theme="light"], html[data-theme="light"] body { color-scheme: light; }
      ::selection { background: color-mix(in srgb, var(--brand) 30%, transparent); }

      :focus-visible {
        outline: 2px solid color-mix(in srgb, var(--brand) 75%, transparent);
        outline-offset: 2px;
      }

      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ============ 1. 顶栏 ============ */
      .topbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px var(--shell-pad) 8px;
        min-height: 38px;
      }
      .brand { display: flex; align-items: center; gap: 8px; flex: none; }
      .brand svg { color: var(--brand); display: block; }
      h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
      .status {
        flex: 1;
        min-width: 0;
        margin-left: 4px;
        font-family: var(--mono);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
      }

      /* ============ 2. 按钮体系 ============ */
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        padding: 0 14px;
        height: 30px;
        border-radius: var(--r-md);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        transition:
          background-color var(--t-fast) var(--ease),
          border-color var(--t-fast) var(--ease),
          color var(--t-fast) var(--ease),
          transform var(--t-fast) var(--ease),
          box-shadow var(--t-fast) var(--ease);
      }
      .btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

      .btn.primary {
        background: var(--brand);
        border-color: transparent;
        color: var(--brand-ink);
        font-weight: 600;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 1px 4px color-mix(in srgb, var(--brand) 26%, transparent);
      }
      .btn.primary:hover {
        background: color-mix(in srgb, var(--brand) 92%, #ffffff);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.26),
          0 2px 8px color-mix(in srgb, var(--brand) 34%, transparent);
      }
      .btn.primary:active { transform: translateY(1px); }
      .btn.primary:disabled {
        background: var(--brand);
        opacity: 0.4;
        box-shadow: none;
      }

      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-2);
      }
      .btn.ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

      .btn.sm { height: 24px; padding: 0 10px; font-size: 11px; border-radius: var(--r-sm); gap: 5px; }

      /* 空闲态大 CTA */
      .btn.xl { height: 40px; padding: 0 22px; font-size: 13.5px; border-radius: var(--r-full); gap: 9px; }
      .btn.xl svg { opacity: 0.9; }

      /* ============ 3. 双栏布局 ============ */
      .layout {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        align-items: start;
        gap: var(--pane-gap);
        padding: 0 var(--shell-pad) var(--pane-gap);
      }
      .pick-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .readout-pane {
        display: flex;
        flex-direction: column;
        gap: var(--pane-gap);
        min-width: 0;
      }

      /* ============ 4. 取色舞台 ============ */
      .idle-card {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        min-height: 232px;
      }
      body.picking .idle-card { display: none; }
      .idle-eyebrow {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: var(--text-3);
        text-transform: uppercase;
      }
      .idle-motif { display: block; }
      .idle-hint {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.7;
        color: var(--text-3);
        max-width: 260px;
      }

      #picker-wrap { display: none; }
      #picker-wrap.active {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
        min-height: 0;
      }

      #shot-view {
        position: relative;
        flex: 1 1 auto;
        min-height: var(--shot-min-h);
        overflow: hidden;
        cursor: crosshair;
        background: #101316;
        border-radius: var(--r-md);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      #shot-view img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      /* HEX 浮标：跟随光标 */
      .cursor-badge {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 2;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px 3px 4px;
        background: rgba(23, 25, 27, 0.92);
        border: 1px solid var(--border-strong);
        border-radius: var(--r-sm);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        will-change: transform;
      }
      .cursor-badge[hidden] { display: none; }
      .cursor-badge i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
      }
      .cursor-badge span {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      /* 放大镜行：画布 + 悬停读数 + 确认 */
      .mag-row {
        flex: none;
        display: flex;
        gap: 12px;
        align-items: stretch;
      }
      .mag-frame {
        flex: none;
        padding: 6px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      #magnifier {
        display: block;
        width: 121px;
        height: 121px;
        border-radius: 5px;
        background: #101316;
      }
      .mag-side {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }
      .mag-chipline { display: flex; align-items: center; gap: 8px; min-width: 0; }
      #mag-swatch {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
        transition: background-color var(--t-fast) var(--ease);
      }
      #mag-hex {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.03em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      #mag-rgb {
        font-family: var(--mono);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ============ 5. 卡片 ============ */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 12px;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-2);
      }

      /* —— 当前颜色 —— */
      .big-swatch {
        height: 56px;
        border-radius: var(--r-md);
        box-shadow:
          inset 0 0 0 1px var(--border-strong),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
        transition: background-color var(--t-fast) var(--ease);
        margin-bottom: 10px;
      }
      .vals { display: flex; flex-direction: column; gap: 6px; }
      .val-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 5px 0 10px;
        background: var(--surface-2);
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        transition:
          background-color var(--t-fast) var(--ease),
          border-color var(--t-fast) var(--ease);
      }
      .val-row:hover { background: var(--surface-3); border-color: var(--border); }
      .val-label {
        flex: none;
        width: 30px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text-3);
        font-family: var(--mono);
      }
      .val-text {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .copy-btn {
        appearance: none;
        flex: none;
        border: none;
        background: transparent;
        color: var(--text-3);
        width: 24px;
        height: 24px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity var(--t-fast) var(--ease),
          background-color var(--t-fast) var(--ease),
          color var(--t-fast) var(--ease);
      }
      .val-row:hover .copy-btn,
      .val-row:focus-within .copy-btn,
      .copy-btn.copied { opacity: 1; }
      .copy-btn:hover { background: var(--surface); color: var(--text); }
      .copy-btn .ic-check { display: none; }
      .copy-btn.copied { color: var(--brand); }
      .copy-btn.copied .ic-copy { display: none; }
      .copy-btn.copied .ic-check { display: block; }

      /* —— 手动换算 —— */
      .manual-row { display: flex; align-items: center; gap: 8px; }
      .manual-row label {
        flex: none;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text-3);
        font-family: var(--mono);
      }
      #hex-input {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 0 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.03em;
        font-variant-numeric: tabular-nums;
        outline: none;
        transition:
          border-color var(--t-fast) var(--ease),
          box-shadow var(--t-fast) var(--ease),
          background-color var(--t-fast) var(--ease);
      }
      #hex-input::placeholder { color: var(--text-3); }
      #hex-input:hover { border-color: var(--border-strong); }
      #hex-input:focus {
        border-color: color-mix(in srgb, var(--brand) 55%, var(--border));
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
      }
      #hex-input.invalid {
        border-color: var(--danger);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent);
      }
      .manual-err {
        margin: 7px 2px 0;
        font-size: 11px;
        line-height: 1.5;
        color: var(--danger);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .manual-err[hidden] { display: none; }
      .manual-outs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
      }
      .out-chip {
        min-width: 0;
        background: var(--surface-2);
        border-radius: var(--r-sm);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .out-chip > span {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--text-3);
        font-family: var(--mono);
      }
      .out-chip > b {
        min-width: 0;
        font-family: var(--mono);
        font-size: 11.5px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* —— 历史色板 —— */
      #btn-clear { flex: none; }
      #palette {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(24px, 1fr));
        grid-auto-rows: 24px;
        gap: 8px;
      }
      #palette .cell {
        border-radius: var(--r-sm);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        cursor: pointer;
        transition:
          transform var(--t-fast) var(--ease),
          box-shadow var(--t-fast) var(--ease);
      }
      #palette .cell:hover {
        transform: scale(1.1);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.3),
          0 2px 8px rgba(0, 0, 0, 0.38);
      }
      #palette .cell.current {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.22),
          0 0 0 2px var(--brand);
      }
      #palette .empty {
        grid-column: 1 / -1;
        border: 1px dashed var(--border-strong);
        border-radius: var(--r-sm);
        padding: 16px 8px;
        text-align: center;
        font-size: 11px;
        line-height: 1.6;
        color: var(--text-3);
      }

      /* ============ 6. 底栏 ============ */
      .foot {
        flex: none;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 7px var(--shell-pad);
        border-top: 1px solid var(--border);
        font-size: 10.5px;
        color: var(--text-3);
      }
      .foot .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

      /* ============ 7. 双形态响应式 ============
         窄容器（Quick 内嵌 ≈ 706px 及以下）：纵向流——大按钮/截图缩略
         → 放大镜+读数并排 → 当前色三格式 → 色板。
         宽容器（>740px，固定主窗）：左截图/放大镜（更大）+ 右读数与色板。 */
      @supports (container-type: inline-size) {
        .app { container-type: inline-size; container-name: app; }

        @container app (min-width: 741px) {
          .app {
            --shell-pad: 16px;
            --pane-gap: 16px;
            --shot-min-h: 264px;
          }
          .layout {
            grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr);
            grid-template-rows: auto;
            align-items: stretch;
          }
          .idle-card { min-height: 320px; padding: 32px 24px; }
          .big-swatch { height: 64px; }
        }
      }

      /* 无容器查询兜底（旧内核）：断点与容器断点一致 */
      @media (min-width: 741px) {
        .app {
          --shell-pad: 16px;
          --pane-gap: 16px;
          --shot-min-h: 264px;
        }
        .layout {
          grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr);
          grid-template-rows: auto;
          align-items: stretch;
        }
        .idle-card { min-height: 320px; padding: 32px 24px; }
        .big-swatch { height: 64px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 1ms !important;
          animation: none !important;
        }
        #palette .cell:hover { transform: none; }
        .cursor-badge { will-change: auto; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m2 22 1-1h3l9-9" />
            <path d="M3 21v-3l9-9" />
            <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
          </svg>
          <h1>取色器</h1>
        </div>
        <span class="status" id="status">就绪</span>
        <button class="btn ghost sm" id="btn-stop" hidden>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
          退出
        </button>
      </header>

      <div class="layout">
        <!-- 左/上：取色舞台 -->
        <section class="pick-pane">
          <!-- 空闲态 -->
          <div class="idle-card" id="idle-card">
            <span class="idle-eyebrow">Screen Eyedropper</span>
            <svg class="idle-motif" width="88" height="88" viewBox="0 0 88 88" fill="none" aria-hidden="true">
              <defs>
                <pattern id="pxgrid" width="17.6" height="17.6" patternUnits="userSpaceOnUse">
                  <rect x="1" y="1" width="15.6" height="15.6" rx="3.5" fill="rgba(242, 243, 243, 0.055)" />
                </pattern>
              </defs>
              <rect width="88" height="88" rx="14" fill="url(#pxgrid)" />
              <rect x="35.2" y="35.2" width="17.6" height="17.6" rx="3.5" fill="var(--brand)" />
              <path d="M44 19v9M44 60v9M19 44h9M60 44h9" stroke="rgba(242, 243, 243, 0.38)" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <button class="btn primary xl" id="btn-start">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m2 22 1-1h3l9-9" />
                <path d="M3 21v-3l9-9" />
                <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
              </svg>
              开始取色
            </button>
            <p class="idle-hint">截取当前屏幕，移动鼠标以 11×11 放大镜精准取点，点击或按「确定取色」收录颜色</p>
          </div>

          <!-- 取色态 -->
          <div id="picker-wrap">
            <div id="shot-view">
              <img id="shot-img" alt="屏幕截图" />
              <div class="cursor-badge" id="cursor-badge" hidden><i id="cursor-chip"></i><span id="cursor-hex">#------</span></div>
            </div>
            <div class="mag-row">
              <div class="mag-frame">
                <canvas id="magnifier" width="121" height="121"></canvas>
              </div>
              <div class="mag-side">
                <div class="mag-chipline">
                  <span id="mag-swatch"></span>
                  <span id="mag-hex">#------</span>
                </div>
                <span id="mag-rgb">移入截图取点</span>
                <button class="btn primary" id="btn-confirm" disabled>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m4 12.5 5 5L20 6.5" />
                  </svg>
                  确定取色
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 右/下：读数与色板 -->
        <section class="readout-pane">
          <div class="card">
            <div class="card-head">
              <span class="card-title">当前颜色</span>
            </div>
            <div class="big-swatch" id="big-swatch"></div>
            <div class="vals">
              <div class="val-row">
                <span class="val-label">HEX</span>
                <span class="val-text" id="v-hex">#FFFFFF</span>
                <button class="copy-btn" data-copy="hex" title="复制 HEX" aria-label="复制 HEX">
                  <svg class="ic-copy" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="12" height="12" rx="2.5" />
                    <path d="M5 15h-.5A2.5 2.5 0 0 1 2 12.5v-8A2.5 2.5 0 0 1 4.5 2h8A2.5 2.5 0 0 1 15 4.5V5" />
                  </svg>
                  <svg class="ic-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m4 12.5 5 5L20 6.5" />
                  </svg>
                </button>
              </div>
              <div class="val-row">
                <span class="val-label">RGB</span>
                <span class="val-text" id="v-rgb">rgb(255, 255, 255)</span>
                <button class="copy-btn" data-copy="rgb" title="复制 RGB" aria-label="复制 RGB">
                  <svg class="ic-copy" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="12" height="12" rx="2.5" />
                    <path d="M5 15h-.5A2.5 2.5 0 0 1 2 12.5v-8A2.5 2.5 0 0 1 4.5 2h8A2.5 2.5 0 0 1 15 4.5V5" />
                  </svg>
                  <svg class="ic-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m4 12.5 5 5L20 6.5" />
                  </svg>
                </button>
              </div>
              <div class="val-row">
                <span class="val-label">HSL</span>
                <span class="val-text" id="v-hsl">hsl(0, 0%, 100%)</span>
                <button class="copy-btn" data-copy="hsl" title="复制 HSL" aria-label="复制 HSL">
                  <svg class="ic-copy" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="12" height="12" rx="2.5" />
                    <path d="M5 15h-.5A2.5 2.5 0 0 1 2 12.5v-8A2.5 2.5 0 0 1 4.5 2h8A2.5 2.5 0 0 1 15 4.5V5" />
                  </svg>
                  <svg class="ic-check" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m4 12.5 5 5L20 6.5" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="card-title">手动换算</span>
            </div>
            <div class="manual-row">
              <label for="hex-input">HEX</label>
              <input id="hex-input" placeholder="#RRGGBB，如 #1FB6A6" spellcheck="false" autocomplete="off" />
            </div>
            <div class="manual-err" id="hex-error" hidden>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 8v4.5M12 16h.01" />
              </svg>
              格式无效，应为 #RRGGBB 六位十六进制
            </div>
            <div class="manual-outs">
              <div class="out-chip"><span>RGB</span><b id="m-rgb">rgb(255, 255, 255)</b></div>
              <div class="out-chip"><span>HSL</span><b id="m-hsl">hsl(0, 0%, 100%)</b></div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <span class="card-title">历史色板</span>
              <button class="btn ghost sm" id="btn-clear">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 7h16" />
                  <path d="M10 11v6M14 11v6" />
                  <path d="m6 7 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" />
                  <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
                </svg>
                清空
              </button>
            </div>
            <div id="palette"></div>
          </div>
        </section>
      </div>

      <footer class="foot">
        <span>点击截图取色 · 点击色块复制 HEX</span>
        <span class="mono">Enter 复制当前色</span>
      </footer>
    </div>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
