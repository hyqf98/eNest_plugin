<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>远程桌面</title>

    <link rel="stylesheet" href="./src/css/main.css" />
  </head>
  <body>
    <div class="app" id="app" data-mode="shell">
      <!-- 顶部条：quick=会话状态条 / shell=标题与操作 -->
      <header class="topbar" id="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">▣</span><strong>远程桌面</strong><span class="mode-label" id="mode-label"></span></div>
        <nav class="tabs" id="tabs" aria-label="会话"></nav>
        <div class="topbar-end">
          <button class="ghost" id="btn-new" title="新建连接">＋ 新建</button>
          <button class="ghost" id="btn-test" title="连接测试">测试</button>
          <button class="ghost" id="btn-import" title="导入 JSON / 粘贴 URI">导入</button>
          <button class="ghost" id="btn-export" title="导出 JSON（密码为空）">导出</button>
          <span class="spacer"></span>
          <button class="ghost" id="btn-shell-expand" title="在桌面展开" hidden>↗ 展开</button>
        </div>
      </header>

      <div class="workspace" id="workspace">
        <!-- 左侧：资产侧栏（shell 模式） -->
        <aside class="side" id="side">
          <div class="side-tools">
            <input id="search" type="search" placeholder="搜索名称 / 主机 / 标签" aria-label="搜索连接资产" data-input-context="editor" />
          </div>
          <div class="tree" id="tree"><div class="empty">加载中…</div></div>
          <div class="side-foot">
            <select id="group-jump" aria-label="分组筛选"><option value="">全部分组</option></select>
          </div>
        </aside>

        <!-- 主区：未连接=欢迎/最近；连接后=会话画布 -->
        <main class="main" id="main">
          <section class="welcome" id="welcome">
            <div class="hero">
              <h2>远程桌面</h2>
              <p>VNC 与 RDP 双协议，支持 SSH 隧道直达内网。</p>
              <div class="quick-uri">
                <input id="uri-input" type="text" placeholder="粘贴 vnc://host:5901 或 rdp://user@host:3389" aria-label="快速连接 URI" data-input-context="editor" />
                <button class="primary" id="btn-uri-go">连接</button>
              </div>
            </div>
            <div class="recent" id="recent-panel">
              <div class="panel-head"><h3>最近连接</h3><button class="ghost" id="btn-clear-recent" title="清空最近记录">清空</button></div>
              <div class="recent-list" id="recent-list"></div>
            </div>
            <div class="empty-guide" id="empty-guide" hidden>
              <p>还没有连接资产。</p>
              <button class="primary" id="btn-empty-new">新建连接</button>
            </div>
          </section>
          <div class="sessions" id="sessions" hidden></div>
        </main>
      </div>
    </div>

    <dialog id="profile-dialog"></dialog>
    <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>


    <!-- noVNC（MPL-2.0 / BSD，vendored CJS 最小集；由 loader 挂载到 window.RFB） -->






    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
