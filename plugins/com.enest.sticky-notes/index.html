<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>备忘录</title>

    <style>
      :root {
        --line: var(--border, #e4e1db);
        --paper: var(--surface, #fffdfa);
        --muted: var(--text-2, #81796f);
        --ink: var(--text, #35332f);
        --warm: var(--accent, #a16b3c);
      }
      body {
        overflow: hidden;
      }
      button {
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      button:hover {
        background: var(--surface-2, #eee9e2);
      }
      input,
      textarea,
      select {
        color: inherit;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        min-width: 0;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
      }
      .library {
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid var(--line);
      }
      header {
        padding: 22px 20px 13px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.5px;
      }
      header span {
        flex: 1;
      }
      .small {
        font-size: 11px;
        color: var(--muted);
      }
      .new {
        color: var(--warm);
        background: color-mix(in srgb, var(--warm) 11%, transparent);
      }
      .search-wrap {
        padding: 0 16px 12px;
      }
      .search-wrap input {
        width: 100%;
        background: transparent;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        gap: 2px;
        padding: 0 12px 8px;
        overflow: auto;
      }
      .tabs button {
        font-size: 12px;
        white-space: nowrap;
      }
      .active {
        color: var(--warm);
        background: color-mix(in srgb, var(--warm) 10%, transparent);
      }
      .library-tools {
        padding: 9px 16px;
        display: flex;
        gap: 7px;
      }
      .library-tools select {
        padding: 4px;
        max-width: 140px;
      }
      #notes {
        overflow: auto;
        flex: 1;
        padding: 0 10px;
      }
      .note-row {
        padding: 14px 12px;
        margin: 3px 0;
        border-radius: 7px;
        cursor: pointer;
        border: 1px solid transparent;
        position: relative;
      }
      .note-row.selected {
        background: var(--paper);
        border-color: var(--line);
        box-shadow: 0 2px 5px #20202005;
      }
      .note-row::before {
        content: '';
        position: absolute;
        left: 1px;
        top: 18px;
        bottom: 18px;
        width: 3px;
        border-radius: 3px;
        background: var(--note-color, #cba15f);
      }
      .note-title {
        font-size: 14px;
        font-weight: 600;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
      .note-excerpt {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        margin: 6px 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .note-meta {
        font-size: 10px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
      }
      .library footer {
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 3px;
      }
      .editor {
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--paper);
      }
      .editor-top {
        padding: 16px 22px;
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 1px solid var(--line);
      }
      .editor-top .spacer {
        flex: 1;
      }
      .editor-top select {
        max-width: 130px;
      }
      .document {
        max-width: 850px;
        width: 100%;
        padding: 25px 40px 12px;
        margin: 0 auto;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #title {
        font-size: 25px;
        letter-spacing: -0.6px;
        font-weight: 600;
        border: 0;
        padding: 0 0 14px;
        background: transparent;
        border-radius: 0;
      }
      #tags {
        font-size: 11px;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 0 12px;
        background: transparent;
        border-radius: 0;
        margin-bottom: 15px;
      }
      #body {
        resize: none;
        border: 0;
        outline: 0 !important;
        background: transparent;
        padding: 0;
        font-size: 15px;
        line-height: 1.85;
        flex: 1;
        min-height: 100px;
      }
      #preview {
        overflow: auto;
        flex: 1;
        font-size: 15px;
        line-height: 1.85;
        overflow-wrap: anywhere;
      }
      #preview h1,
      #preview h2,
      #preview h3 {
        margin: 18px 0 10px;
      }
      #preview pre {
        background: var(--surface-2, #f1eeea);
        padding: 12px;
        overflow: auto;
        border-radius: 7px;
      }
      #preview code {
        font-family: ui-monospace, monospace;
      }
      #preview p {
        margin: 5px 0;
      }
      .editor-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 25px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid var(--line);
      }
      #save-state {
        margin-left: auto;
      }
      .empty {
        padding: 70px 22px;
        text-align: center;
        color: var(--muted);
        line-height: 1.8;
      }
      .colors {
        display: flex;
        gap: 6px;
      }
      .color {
        width: 15px;
        height: 15px;
        padding: 0;
        border-radius: 50%;
        background: var(--swatch) !important;
      }
      .color.chosen {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #notes.grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 8px;
        align-content: start;
      }
      .app.grid-layout {
        grid-template-columns: minmax(370px, 1fr) minmax(340px, 1fr);
      }
      .grid .note-row {
        background: var(--paper);
        border-color: var(--line);
        min-height: 130px;
      }
      .grid .note-excerpt {
        -webkit-line-clamp: 4;
      }
      .quick-composer {
        padding: 10px 12px;
        display: flex;
        gap: 7px;
      }
      .quick-composer input {
        flex: 1;
      }
      .editor-empty {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      [data-mode='quick'] .app {
        grid-template-columns: 1fr;
      }
      [data-mode='quick'] .library {
        border: 0;
      }
      [data-mode='quick'] header {
        padding: 10px 14px;
      }
      [data-mode='quick'] h1 {
        font-size: 14px;
      }
      [data-mode='quick'] .editor {
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      [data-mode='quick'] .editor:not(.open) {
        display: none;
      }
      [data-mode='quick'] .document {
        padding: 15px 20px;
      }
      [data-mode='quick'] #title {
        font-size: 19px;
      }
      [data-mode='quick'] #body {
        font-size: 14px;
      }
      [data-mode='quick'] .editor-top {
        padding: 8px 12px;
        flex-wrap: wrap;
      }
      [data-mode='quick'] .note-row {
        padding: 9px 12px;
      }
      [data-mode='quick'] .note-excerpt {
        -webkit-line-clamp: 1;
        margin: 3px 0;
      }
      @media (max-width: 750px) {
        [data-mode='shell'] .app {
          grid-template-columns: 260px 1fr;
        }
        .document {
          padding: 20px;
        }
        .editor-top {
          padding: 10px;
          flex-wrap: wrap;
        }
      }
      @media (max-width: 580px) {
        [data-mode='shell'] .app {
          grid-template-columns: 1fr;
        }
        [data-mode='shell'] .editor {
          position: absolute;
          inset: 0;
          z-index: 5;
        }
        [data-mode='shell'] .editor:not(.open) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <section class="library">
        <header>
          <div>
            <h1>备忘录</h1>
            <div class="small shell-only">留住想法，再慢慢整理</div>
          </div>
          <span></span><button class="new" id="new">＋ 新建</button>
        </header>
        <div class="search-wrap shell-only">
          <input
            id="search"
            type="search"
            placeholder="搜索笔记、标签"
            aria-label="搜索笔记"
          />
        </div>
        <form class="quick-composer quick-only" id="quick-form">
          <input
            id="quick-input"
            placeholder="记下一句话…"
            aria-label="快速记录"
          /><button class="new">记录</button>
        </form>
        <div class="tabs" id="tabs"></div>
        <div class="library-tools">
          <select id="tag-filter" aria-label="标签筛选">
            <option value="">全部标签</option></select
          ><button id="layout" class="shell-only">卡片视图</button
          ><select id="template" aria-label="新建模板">
            <option value="">从模板新建</option>
            <option value="meeting">会议记录</option>
            <option value="checklist">行动清单</option>
            <option value="idea">想法草稿</option>
          </select>
        </div>
        <div id="notes" role="list"></div>
        <footer class="shell-only">
          <button id="export-all">导出备份</button
          ><button id="import">导入</button
          ><button data-open-settings>设置</button
          >
        </footer>
      </section>
      <section class="editor" id="editor">
        <div class="editor-empty">选择一条笔记，或开始记录</div>
      </section>
    </div>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
