<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>密码工具箱</title>
    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="pkgen">
      <header class="app-bar">
        <h1 class="shell-only">密码工具箱</h1>
        <nav class="segmented" role="tablist" aria-label="工具模式">
          <button role="tab" data-kind="password" aria-selected="true">密码</button
          ><button role="tab" data-kind="passphrase" aria-selected="false">密码短语</button
          ><button role="tab" data-kind="pin" aria-selected="false">PIN</button
          ><button role="tab" data-kind="uuid" aria-selected="false">UUID v4</button
          ><button role="tab" data-kind="inspect" aria-selected="false">强度检查</button>
        </nav>
        <span class="grow"></span>
        <button id="mask" class="pk-btn ghost shell-only" aria-pressed="true">显示内容</button>
      </header>

      <div class="layout">
        <aside class="params" aria-label="参数">
          <section class="panel" data-panel="password">
            <label class="field-label" for="length"
              >长度 <output id="length-value">16</output></label
            >
            <div class="length-control">
              <input id="length" type="range" min="6" max="128" value="16" aria-label="密码长度" /><input
                id="length-number"
                type="number"
                min="6"
                max="128"
                value="16"
                aria-label="长度数字"
              />
            </div>
            <div class="presets">
              <button data-length="12">12</button
              ><button data-length="16">16</button
              ><button data-length="24">24</button
              ><button data-length="32">32</button
              ><button data-length="64">64</button>
            </div>
            <fieldset>
              <legend>字符集</legend>
              <label><input id="lower" type="checkbox" checked /> 小写 a–z</label
              ><label><input id="upper" type="checkbox" checked /> 大写 A–Z</label
              ><label><input id="digit" type="checkbox" checked /> 数字 0–9</label
              ><label><input id="symbol" type="checkbox" checked /> 符号 !@#</label>
            </fieldset>
            <label class="check"
              ><input id="ambiguous" type="checkbox" /> 排除易混淆字符 O0oIl1|</label
            >
            <details class="advanced">
              <summary>自定义排除字符</summary>
              <input id="exclude" aria-label="排除字符" placeholder="例如 {}[]/\" />
            </details>
          </section>

          <section class="panel" data-panel="passphrase" hidden>
            <label class="field-label" for="words"
              >单词数 <output id="words-value">4</output></label
            >
            <input id="words" type="range" min="2" max="12" value="4" aria-label="单词数" />
            <div class="presets">
              <button data-words="3">3 词</button
              ><button data-words="4">4 词</button
              ><button data-words="5">5 词</button
              ><button data-words="6">6 词</button>
            </div>
            <label class="field-label" for="phrase-separator">分隔符</label>
            <select id="phrase-separator">
              <option value="-">连字符 -</option>
              <option value=".">点 .</option>
              <option value="_">下划线 _</option>
              <option value=" ">空格</option>
              <option value="">无分隔</option>
            </select>
            <label class="check"><input id="phrase-capitalize" type="checkbox" /> 首字母大写</label>
            <label class="check"
              ><input id="phrase-number" type="checkbox" checked /> 末尾追加两位数字</label
            >
            <p class="panel-note">内置 1500+ 英文短词，词表与拼接全部本地随机。</p>
          </section>

          <section class="panel" data-panel="pin" hidden>
            <label class="field-label" for="pin-length"
              >位数 <output id="pin-length-value">6</output></label
            >
            <input id="pin-length" type="range" min="4" max="16" value="6" aria-label="PIN 位数" />
            <div class="presets">
              <button data-pin="4">4 位</button
              ><button data-pin="6">6 位</button
              ><button data-pin="8">8 位</button
              ><button data-pin="12">12 位</button>
            </div>
            <p class="panel-note">纯数字。适合设备配对码、取件码等短窗口场景，不建议做主密码。</p>
          </section>

          <section class="panel" data-panel="uuid" hidden>
            <p class="panel-note">
              随机 UUID v4，适合记录 ID、测试数据与本地开发。每个 UUID 携带约 122 位随机性。
            </p>
            <label class="check"><input id="uppercase" type="checkbox" /> 大写字母</label
            ><label class="check"><input id="hyphens" type="checkbox" checked /> 保留连字符</label
            ><label class="field-label" for="separator">批量复制格式</label>
            <select id="separator">
              <option value="newline">每行一个</option>
              <option value="comma">逗号分隔</option>
              <option value="json">JSON 数组</option>
            </select>
          </section>

          <section class="panel" data-panel="inspect" hidden>
            <label class="field-label" for="inspect-input">要检查的密码</label>
            <textarea
              id="inspect-input"
              rows="3"
              spellcheck="false"
              placeholder="输入或粘贴密码，分析只在本插件内进行"
            ></textarea>
            <p class="panel-note">完全本地分析：估算熵、覆盖字符类、常见结构弱点，不联网、不存储。</p>
          </section>

          <p id="entropy-line" class="panel-note" data-gen-only></p>

          <div class="quantity" data-gen-only>
            <label for="count">生成数量</label
            ><input id="count" type="number" min="1" max="100" value="1" />
          </div>
          <div class="gen-actions" data-gen-only>
            <button class="pk-btn primary" id="generate">生成</button
            ><button id="generate-copy" class="pk-btn primary">生成并复制</button>
          </div>
          <p id="error" role="alert"></p>
        </aside>

        <section class="board">
          <div class="board-head">
            <h2 id="board-title">生成结果</h2>
            <span id="result-count" class="muted"></span>
            <span class="grow" data-gen-only></span>
            <button id="copy-all" class="pk-btn" disabled data-gen-only>全部复制</button>
            <button id="clear-results" class="pk-btn ghost" data-gen-only>清空</button>
          </div>
          <div class="board-scroll">
            <div id="inspect-report" class="report" hidden></div>
            <div id="results" class="results"></div>
            <details id="history-details" class="recent">
              <summary>
                <span>生成历史</span><span id="history-count" class="muted"></span>
                <button id="clear-history" class="pk-btn ghost">清空</button>
              </summary>
              <div id="history"></div>
            </details>
          </div>
        </section>
      </div>

      <footer>
        <span id="privacy">密码仅在当前会话保留，关闭插件后清除</span
        ><span class="shell-only">Enter 生成 · 按住条目可临时显示 · 点击复制</span>
      </footer>
    </main>
    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
