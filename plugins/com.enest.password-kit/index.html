<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>密码工具箱</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="generator">
      <header>
        <h1>密码工具箱</h1>
        <nav>
          <button data-kind="password" aria-pressed="true">密码</button
          ><button data-kind="uuid" aria-pressed="false">UUID v4</button>
        </nav>
        <button id="mask" aria-pressed="true">显示内容</button>
      </header>
      <div class="generation-layout">
        <aside class="parameters">
          <section id="password-options">
            <label class="field-label" for="length"
              >密码长度 <output id="length-value">16</output></label
            >
            <div class="length-control">
              <input
                id="length"
                type="range"
                min="6"
                max="128"
                value="16"
              /><input
                id="length-number"
                type="number"
                min="6"
                max="128"
                value="16"
                aria-label="密码长度数字"
              />
            </div>
            <div class="presets">
              <button data-length="12">12 位</button
              ><button data-length="16">16 位</button
              ><button data-length="24">24 位</button
              ><button data-length="32">32 位</button>
            </div>
            <fieldset>
              <legend>字符集</legend>
              <label
                ><input id="lower" type="checkbox" checked /> 小写 a–z</label
              ><label
                ><input id="upper" type="checkbox" checked /> 大写 A–Z</label
              ><label
                ><input id="digit" type="checkbox" checked /> 数字 0–9</label
              ><label
                ><input id="symbol" type="checkbox" checked /> 符号 !@#</label
              >
            </fieldset>
            <label class="check"
              ><input id="ambiguous" type="checkbox" /> 排除易混淆字符
              O0oIl1|</label
            >
            <details class="advanced">
              <summary>自定义排除字符</summary>
              <input
                id="exclude"
                aria-label="排除字符"
                placeholder="例如 {}[]/\\"
              />
            </details>
            <div class="strength">
              <div><i id="strength-bar"></i></div>
              <span id="strength-text"></span>
            </div>
          </section>
          <section id="uuid-options" hidden>
            <h2>UUID v4</h2>
            <p>随机标识符，适用于记录 ID、测试数据和本地开发。</p>
            <label class="check"
              ><input id="uppercase" type="checkbox" /> 大写字母</label
            ><label class="check"
              ><input id="hyphens" type="checkbox" checked /> 保留连字符</label
            ><label class="field-label" for="separator">批量复制格式</label
            ><select id="separator">
              <option value="newline">每行一个</option>
              <option value="comma">逗号分隔</option>
              <option value="json">JSON 数组</option>
            </select>
          </section>
          <div class="quantity">
            <label for="count">生成数量</label
            ><input id="count" type="number" min="1" max="100" value="1" />
          </div>
          <button class="primary" id="generate">生成</button
          ><button id="generate-copy">生成并复制</button>
          <p id="error" role="alert"></p>
        </aside>
        <section class="results-panel">
          <div class="results-head">
            <h2 id="result-title">生成结果</h2>
            <span id="result-count"></span
            ><button id="copy-all" disabled>全部复制</button
            ><button id="clear-results">清空</button>
          </div>
          <div id="results" class="results">
            <p class="empty">
              设置长度和字符集，点击生成。<br />每条结果都可以单独复制。
            </p>
          </div>
          <details id="history-details" class="recent">
            <summary>
              本次会话最近 8 条 <button id="clear-history">清空记录</button>
            </summary>
            <div id="history"></div>
          </details>
        </section>
      </div>
      <footer>
        <span id="privacy">密码仅在当前会话保留，关闭插件后清除</span
        ><span>Enter 生成 · 点击结果复制</span>
      </footer>
    </main>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
