<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>粘贴板</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #161b22;
        --surface-2: #1c2330;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8eef7;
        --text-2: #9aa7b8;
        --text-3: #6b7789;
        --accent: #5b8cff;
        --ok: #3dd68c;
        --danger: #ff6b7a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-rows: auto auto 1fr;
        height: 100%;
        min-height: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      input[type="search"] {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        outline: none;
      }
      input[type="search"]:focus { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        padding: 7px 12px;
        border-radius: 10px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
      .btn.danger { color: var(--danger); }
      .list {
        overflow: auto;
        padding: 10px 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .item:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
      .item.pinned { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
      .body { min-width: 0; }
      .type {
        font-size: 11px;
        color: var(--text-3);
        margin-bottom: 4px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pin-flag { color: var(--ok); }
      .text {
        font-size: 13px;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 3.6em;
        overflow: hidden;
      }
      .imgwrap {
        width: 100%;
        max-height: 120px;
        overflow: hidden;
        border-radius: 8px;
        background: #000;
      }
      .imgwrap img { width: 100%; max-height: 120px; object-fit: contain; display: block; }
      .meta { font-size: 11px; color: var(--text-3); margin-top: 6px; }
      .actions { display: flex; flex-direction: column; gap: 6px; }
      .empty {
        color: var(--text-3);
        text-align: center;
        padding: 48px 16px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>粘贴板</h1>
        <div class="meta" id="count">0 条</div>
      </header>
      <div class="toolbar">
        <input id="q" type="search" placeholder="搜索历史…" />
        <button class="btn" id="btn-refresh">刷新</button>
        <button class="btn" id="btn-current">当前剪贴板</button>
        <button class="btn danger" id="btn-clear">清空</button>
      </div>
      <div class="list" id="list"><div class="empty">加载中…</div></div>
    </div>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
