<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>翻译</title>

    <style>
      :root {
        --line: var(--border, #dde2e6);
        --paper: var(--surface, #fff);
        --muted: var(--text-2, #78848d);
        --blue: var(--accent, #457aa2);
      }
      body {
        overflow: hidden;
      }
      button {
        border: 1px solid var(--line);
        border-radius: calc(var(--pk-radius, 8px) - 2px);
        background: var(--paper);
        color: inherit;
        padding: 5px 11px;
        min-height: 28px;
        font-size: 12.5px;
        transition: border-color 0.12s ease, background-color 0.12s ease,
          color 0.12s ease, transform 0.1s ease;
      }
      button:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--blue) 45%, var(--line));
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.active {
        color: var(--blue);
        border-color: color-mix(in srgb, var(--blue) 45%, var(--line));
        background: color-mix(in srgb, var(--blue) 10%, transparent);
      }
      /* 语言快捷 chips：pill 形 ghost（同 tab 语义，透明底可见 hover） */
      .common button {
        border-color: transparent;
        background: color-mix(in srgb, var(--text, #252a32) 5%, transparent);
        color: var(--muted);
      }
      .common button:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        color: var(--text);
      }
      .common button.active {
        color: var(--blue);
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        background: color-mix(in srgb, var(--blue) 10%, transparent);
      }
      /* 历史面板过滤 tabs：ghost pill */
      .history-head button[data-history] {
        border-color: transparent;
        background: color-mix(in srgb, var(--text, #252a32) 5%, transparent);
        color: var(--muted);
      }
      .history-head button[data-history]:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        color: var(--text);
      }
      .history-head button[data-history].active {
        color: var(--blue);
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        background: color-mix(in srgb, var(--blue) 10%, transparent);
      }
      /* 微型图标钮（★ / × / ⇄）：保持紧凑但有可见反馈 */
      .entry-meta button,
      .history-head #close-history {
        min-height: 22px;
        padding: 1px 6px;
        border-color: transparent;
        background: color-mix(in srgb, var(--text, #252a32) 5%, transparent);
        color: var(--muted);
      }
      .entry-meta button:hover:not(:disabled),
      .history-head #close-history:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        color: var(--text);
      }
      #swap {
        padding: 5px 10px;
      }
      input,
      select {
        color: inherit;
        background: var(--paper);
        border: 1px solid var(--line);
        padding: 5px 9px;
        min-height: 28px;
        border-radius: calc(var(--pk-radius, 8px) - 2px);
        min-width: 0;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 19px;
        margin: 0;
        letter-spacing: -0.4px;
      }
      header p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
        flex: 1;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        min-height: 0;
        flex: 1;
      }
      .translator {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .language-bar {
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .language-bar select,
      .language-bar .pk-select {
        font-weight: 600;
        min-width: 0;
      }
      .language-bar .pk-select-trigger {
        border: 0;
        background: transparent;
        padding: 5px 6px;
        font-weight: 600;
      }
      .language-bar .pk-select-trigger:hover:not(:disabled) {
        border-color: transparent;
        background: color-mix(in srgb, var(--blue) 8%, transparent);
      }
      .language-bar .spacer {
        flex: 1;
      }
      .common {
        font-size: 11px;
        display: flex;
        gap: 2px;
        color: var(--muted);
      }
      .common button {
        padding: 3px 9px;
        min-height: 24px;
        border-radius: 999px;
        font-size: 11px;
      }
      .common button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .common button:disabled:hover {
        background: transparent;
      }
      .output-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 18px;
      }
      .output-row .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--blue);
        flex: none;
      }
      .output-row .busy-text {
        color: var(--muted);
      }
      .dot.blink {
        animation: translate-pulse 1.1s ease-in-out infinite;
      }
      @keyframes translate-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot.blink { animation: none; }
      }
      .panes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: 1;
        min-height: 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 20px 24px;
      }
      .pane + .pane {
        border-left: 1px solid var(--line);
        background: color-mix(in srgb, var(--paper) 60%, transparent);
      }
      .pane-label {
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .pane-label button {
        padding: 4px 9px;
        min-height: 26px;
        font-size: 12px;
        border-color: transparent;
        background: color-mix(in srgb, var(--text, #252a32) 5%, transparent);
        color: var(--muted);
      }
      .pane-label button:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        color: var(--text);
      }
      #input {
        flex: 1;
        min-height: 100px;
        resize: none;
        border: 0;
        background: transparent;
        color: inherit;
        outline: 0 !important;
        font-size: 18px;
        line-height: 1.8;
        padding: 0;
        font-family: inherit;
      }
      #output {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        overflow: auto;
        font-size: var(--translation-font, 18px);
        line-height: 1.8;
        flex: 1;
        min-height: 90px;
      }
      .placeholder {
        color: var(--muted);
      }
      .pane-bottom {
        display: flex;
        gap: 5px;
        align-items: center;
        padding-top: 13px;
        font-size: 11px;
        color: var(--muted);
      }
      .pane-bottom .spacer {
        flex: 1;
      }
      .primary {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
        padding: 6px 20px;
      }
      .primary:hover:not(:disabled) {
        background: var(--blue);
        border-color: var(--blue);
        filter: brightness(1.04);
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 14px 24px;
      }
      .actions .grow {
        flex: 1;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .history {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-left: 1px solid var(--line);
      }
      .history-head {
        padding: 14px 15px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .history-head button[data-history] {
        padding: 3px 10px;
        min-height: 24px;
        font-size: 12px;
        border-radius: 999px;
      }
      #close-history {
        margin-left: auto;
      }
      .history-search {
        padding: 0 15px 12px;
      }
      .history-search input {
        width: 100%;
      }
      #history-list {
        overflow: auto;
        flex: 1;
        padding: 0 10px;
      }
      .entry {
        padding: 12px 10px;
        border-top: 1px solid var(--line);
        cursor: pointer;
      }
      .entry:hover {
        background: var(--paper);
      }
      .entry-source {
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }
      .entry-result {
        font-size: 13px;
        line-height: 1.6;
        margin: 6px 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .entry-meta {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .entry-meta span {
        flex: 1;
      }
      .entry-meta button {
        padding: 2px 6px;
      }
      .history-foot {
        padding: 8px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 6px;
      }
      .history-foot button {
        flex: 1;
        font-size: 12px;
        padding: 4px 9px;
        border-color: transparent;
        background: color-mix(in srgb, var(--text, #252a32) 5%, transparent);
        color: var(--muted);
      }
      .history-foot button:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--blue) 45%, transparent);
        color: var(--text);
      }
      .empty {
        padding: 45px 15px;
        text-align: center;
        color: var(--muted);
        line-height: 1.8;
        font-size: 12px;
      }
      .error {
        color: var(--danger, #b65353);
      }
      .busy {
        opacity: 0.65;
      }
      .counter {
        font-variant-numeric: tabular-nums;
      }
      #detected {
        font-size: 11px;
        color: var(--muted);
      }
      [data-mode='quick'] header {
        display: none;
      }
      [data-mode='quick'] .workspace {
        grid-template-columns: 1fr;
      }
      [data-mode='quick'] .language-bar {
        padding: 7px 10px;
      }
      [data-mode='quick'] .panes {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(90px, 0.65fr) minmax(120px, 1fr);
      }
      [data-mode='quick'] .pane {
        padding: 10px 15px;
      }
      [data-mode='quick'] .pane + .pane {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      [data-mode='quick'] #input {
        font-size: 14px;
        min-height: 40px;
      }
      [data-mode='quick'] #output {
        font-size: 16px;
        min-height: 50px;
      }
      [data-mode='quick'] .pane-label {
        margin-bottom: 5px;
      }
      [data-mode='quick'] .pane-bottom {
        padding-top: 5px;
      }
      [data-mode='quick'] .actions {
        padding: 8px 12px;
      }
      [data-mode='quick'] .history.open {
        display: flex !important;
        position: absolute;
        inset: 0;
        z-index: 5;
        background: var(--paper);
      }
      [data-mode='quick'] .common {
        display: none;
      }
      @media (max-width: 1100px) {
        [data-mode='shell'] .workspace {
          grid-template-columns: 1fr 240px;
        }
        [data-mode='shell'] .panes {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
        [data-mode='shell'] .pane + .pane {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
      @media (max-width: 720px) {
        [data-mode='shell'] .workspace {
          grid-template-columns: 1fr;
        }
        [data-mode='shell'] .history {
          display: none;
        }
        [data-mode='shell'] .history.open {
          display: flex;
          position: absolute;
          inset: 70px 0 0;
          background: var(--paper);
          z-index: 5;
        }
        .common {
          display: none;
        }
        .language-bar {
          padding: 12px;
        }
        .pane {
          padding: 15px;
        }
        .actions {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>翻译</h1>
        <p>读懂另一种表达</p>
        <button id="history-toggle">历史与收藏</button
        ><button data-open-settings>设置</button>
      </header>
      <main class="workspace">
        <section class="translator">
          <div class="language-bar">
            <select id="src" aria-label="源语言"></select
            ><button id="swap" aria-label="交换语言">⇄</button
            ><select id="tgt" aria-label="目标语言"></select>
            <div class="common">
              <button data-lang="zh-CN">中</button
              ><button data-lang="en">英</button
              ><button data-lang="ja">日</button
              ><button data-lang="ko">韩</button
              ><button data-lang="fr">法</button>
            </div>
            <span class="spacer"></span
            ><select id="engine" aria-label="翻译引擎">
              <option value="auto">自动引擎</option>
              <option value="google">Google</option>
              <option value="mymemory">MyMemory</option></select
            ><button class="quick-only" id="quick-history">历史</button>
          </div>
          <div class="panes">
            <section class="pane">
              <div class="pane-label">
                <span>原文</span>
                <div>
                  <button id="paste">粘贴</button
                  ><button id="clear">清空</button>
                </div>
              </div>
              <textarea
                id="input"
                spellcheck="false"
                placeholder="输入或粘贴文本，点击翻译"
                aria-label="待翻译文本"
                maxlength="10000"
              ></textarea>
              <div class="pane-bottom">
                <span class="counter" id="counter">0 / 10000</span
                ><span class="spacer"></span><span id="detected"></span>
              </div>
            </section>
            <section class="pane">
              <div class="pane-label">
                <span>译文</span><span id="engine-tag"></span>
              </div>
              <div
                id="output"
                role="status"
                aria-live="polite"
                class="placeholder"
              >
                译文会显示在这里
              </div>
              <div class="pane-bottom">
                <div class="output-row" id="output-state" hidden>
                  <span class="dot blink" aria-hidden="true"></span
                  ><span class="busy-text" id="output-state-text">正在获取译文…</span>
                </div>
                <button id="favorite" disabled>☆ 收藏</button
                ><span class="spacer"></span
                ><button id="copy-both" disabled>复制双语</button
                ><button id="copy" disabled>复制译文</button>
              </div>
            </section>
          </div>
          <div class="actions">
            <span class="hint" id="hint">输入即翻译 · Enter 立即 · Shift+Enter 换行</span
            ><span class="grow"></span
            ><button id="export-current" class="shell-only" disabled>
              导出文本</button
            ><button id="run" class="primary">翻译</button>
          </div>
        </section>
        <aside class="history shell-only" id="history">
          <div class="history-head">
            <button data-history="all" class="active">最近翻译</button
            ><button data-history="starred">收藏</button
            ><button id="close-history" aria-label="关闭历史面板">×</button>
          </div>
          <div class="history-search">
            <input
              id="history-search"
              type="search"
              placeholder="搜索原文或译文"
              aria-label="搜索翻译历史"
            />
          </div>
          <div id="history-list"></div>
          <div class="history-foot">
            <button id="export-history">导出历史</button
            ><button id="clear-history">清空未收藏</button>
          </div>
        </aside>
      </main>
    </div>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
