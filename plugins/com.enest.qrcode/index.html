<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>二维码</title>


    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="qr-studio">
      <header>
        <h1>二维码</h1>
        <nav>
          <button data-tab="generate" aria-pressed="true">生成</button
          ><button data-tab="decode" aria-pressed="false">识别</button
          ><button data-tab="batch" aria-pressed="false">批量生成</button>
        </nav>
        <span>本地处理</span>
      </header>
      <div class="pages">
        <section data-page="generate" class="generate-page">
          <div class="composer">
            <div class="template-tabs">
              <label for="template">内容类型</label
              ><select id="template">
                <option value="text">文本 / URL</option>
                <option value="wifi">Wi-Fi</option>
                <option value="contact">联系人</option>
                <option value="email">邮件</option></select
              ><button id="paste-text">粘贴</button>
            </div>
            <div data-template="text">
              <textarea
                id="input"
                aria-label="二维码文本"
                placeholder="输入文本或 URL，实时生成"
              ></textarea>
            </div>
            <div data-template="wifi" class="template-fields" hidden>
              <label>网络名称<input id="wifi-ssid" autocomplete="off" /></label
              ><label
                >密码<input
                  id="wifi-password"
                  type="password"
                  autocomplete="off" /></label
              ><label
                >加密<select id="wifi-security" aria-label="加密方式">
                  <option value="WPA">WPA / WPA2</option>
                  <option value="WEP">WEP</option>
                  <option value="nopass">开放网络</option>
                </select></label
              ><label class="check"
                ><input type="checkbox" id="wifi-hidden" />隐藏网络</label
              >
            </div>
            <div data-template="contact" class="template-fields" hidden>
              <label>姓名<input id="contact-name" /></label
              ><label>电话<input id="contact-phone" type="tel" /></label
              ><label>邮箱<input id="contact-email" type="email" /></label
              ><label>组织<input id="contact-company" /></label>
            </div>
            <div data-template="email" class="template-fields" hidden>
              <label>邮箱<input id="email-to" type="email" /></label
              ><label>主题<input id="email-subject" /></label
              ><label>正文<textarea id="email-body"></textarea></label>
            </div>
            <details class="options" id="options" open>
              <summary>图像选项</summary>
              <div class="options-grid">
                <label
                  >尺寸<select id="size" aria-label="尺寸">
                    <option>128</option>
                    <option selected>256</option>
                    <option>512</option>
                    <option>1024</option>
                  </select></label
                ><label
                  >纠错<select id="ecc" aria-label="纠错级别">
                    <option value="L">L · 7%</option>
                    <option value="M" selected>M · 15%</option>
                    <option value="Q">Q · 25%</option>
                    <option value="H">H · 30%</option>
                  </select></label
                ><label
                  >前景<input id="fg" type="color" value="#000000" /></label
                ><label
                  >背景<input id="bg" type="color" value="#ffffff"
                /></label>
              </div>
              <div class="style-block">
                <span class="field-label">点样式</span>
                <div id="dot-style-seg" class="mode-seg" role="radiogroup" aria-label="点样式"></div>
                <span class="field-label">中心 logo</span>
                <div class="logo-row">
                  <button id="logo-file-btn" type="button" onclick="document.getElementById('logo-file').click()">选择图片</button>
                  <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
                  <label class="logo-scale-label">占码宽 <output id="logo-scale-value">20%</output><input id="logo-scale" type="range" min="8" max="28" step="2" value="20" /></label>
                  <button id="logo-clear" type="button" disabled>移除</button>
                </div>
                <p class="style-hint"><span id="logo-status">未设置</span> · logo 叠加后自动留白，与定位角冲突时会跳过并提示</p>
              </div>
            </details>
            <p id="error" role="alert"></p>
            <div class="actions">
              <button id="copy-image" class="primary" disabled>复制图片</button
              ><label class="png-size-label">导出尺寸<select id="png-size" aria-label="PNG 导出尺寸">
                <option value="256">256</option>
                <option value="512">512</option>
                <option value="1024">1024</option>
                <option value="2048">2048</option>
              </select></label
              ><button id="save-png" disabled>保存 PNG</button
              ><button id="save-svg" disabled>保存 SVG</button>
            </div>
          </div>
          <aside class="preview-column">
            <div class="qr-preview">
              <canvas
                id="canvas"
                width="256"
                height="256"
                aria-label="生成的二维码"
              ></canvas>
              <p id="empty">输入内容开始生成</p>
            </div>
            <p id="meta"></p>
            <details class="history">
              <summary>本次会话已复制 / 保存的记录</summary>
              <div id="history"></div>
            </details>
          </aside>
        </section>
        <section data-page="decode" class="decode-page" hidden>
          <div
            id="drop-zone"
            class="drop-zone"
            tabindex="0"
            role="button"
            aria-label="选择或拖入二维码图片"
          >
            <p>拖入二维码图片</p>
            <span>支持多张图片，每批最多 30 张</span>
            <div>
              <button id="choose-files">选择图片</button
              ><button id="paste-image">剪贴板图片</button>
            </div>
            <input id="files" type="file" accept="image/*" multiple hidden />
          </div>
          <div class="decode-head">
            <h2>识别结果</h2>
            <button id="copy-decoded">复制全部</button
            ><button id="export-decoded">导出 TSV</button
            ><button id="clear-decoded">清空</button>
          </div>
          <p id="decode-status" role="status"></p>
          <div id="decoded-list"></div>
        </section>
        <section data-page="batch" class="batch-page" hidden>
          <div class="batch-input">
            <h2>一行一个二维码</h2>
            <p>沿用生成页的尺寸、颜色与纠错选项，最多 50 项。</p>
            <textarea
              id="batch-input"
              aria-label="批量二维码输入"
              placeholder="https://example.com\n第二条内容"
            ></textarea>
            <div class="actions">
              <button id="batch-run" class="primary">生成预览</button
              ><button id="batch-save" disabled>保存图集 HTML</button>
            </div>
            <p id="batch-status" role="status"></p>
          </div>
          <div id="batch-grid" class="batch-grid"></div>
        </section>
      </div>
      <footer>
        <span>保留四模块白边，建议保持前景与背景高对比</span
        ><span>生成内容不上传</span>
      </footer>
    </main>

    <script src="assets/vendor/qrcode.min.js"></script>
    <script src="assets/vendor/jsQR.min.js"></script>

    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
