<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>二维码</title>
    <!-- 壳子主题 token（--bg/--surface/--text…）；独立打开时落到下方 html 级兜底 -->
    <link rel="stylesheet" href="enest://plugin/com.enest.qrcode/__enest_theme.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-head">
        <div class="head-left">
          <h1>二维码</h1>
          <span class="head-sub">离线生成 · 解码</span>
        </div>
        <div class="seg" role="tablist" aria-label="模式">
          <button class="seg-btn active" role="tab" aria-selected="true" data-tab="encode">生成</button>
          <button class="seg-btn" role="tab" aria-selected="false" data-tab="decode">解码</button>
          <span class="seg-thumb" aria-hidden="true"></span>
        </div>
      </header>

      <main class="body">
        <!-- ================= 生成页签 ================= -->
        <section class="panel active" id="panel-encode" role="tabpanel" aria-label="生成">
          <div class="encode-grid">
            <!-- 左：输入 + 参数 + 操作 -->
            <div class="encode-left">
              <div class="field field-input">
                <label class="field-label" for="input">
                  内容
                  <span class="field-hint" id="input-count">0 字符</span>
                </label>
                <textarea id="input" placeholder="输入文本或 URL，实时生成二维码…" spellcheck="false"></textarea>
              </div>

              <div class="field">
                <div class="field-label">参数</div>
                <div class="opts">
                  <div class="opt">
                    <span class="opt-label">尺寸</span>
                    <input type="range" id="size" min="128" max="512" step="16" value="256" aria-label="尺寸" />
                    <span class="opt-value mono" id="size-val">256px</span>
                  </div>
                  <div class="opt">
                    <span class="opt-label">纠错</span>
                    <div class="seg seg-mini" id="ecc" role="group" aria-label="纠错等级">
                      <button type="button" class="seg-btn" data-ecc="L" title="L ~7%">L</button>
                      <button type="button" class="seg-btn active" data-ecc="M" title="M ~15%">M</button>
                      <button type="button" class="seg-btn" data-ecc="Q" title="Q ~25%">Q</button>
                      <button type="button" class="seg-btn" data-ecc="H" title="H ~30%">H</button>
                      <span class="seg-thumb" aria-hidden="true"></span>
                    </div>
                  </div>
                  <div class="opt-color-row">
                    <div class="opt opt-color">
                      <span class="opt-label">前景</span>
                      <label class="swatch" title="前景色">
                        <input type="color" id="fg" value="#000000" />
                      </label>
                      <span class="opt-value mono" id="fg-val">#000000</span>
                    </div>
                    <div class="opt opt-color">
                      <span class="opt-label">背景</span>
                      <label class="swatch" title="背景色">
                        <input type="color" id="bg" value="#ffffff" />
                      </label>
                      <span class="opt-value mono" id="bg-val">#FFFFFF</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="actions">
                <button class="btn primary" id="btn-copy">
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.75" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.25A1.75 1.75 0 0 0 8.75 1.5h-5A1.75 1.75 0 0 0 2 3.25v5A1.75 1.75 0 0 0 3.75 10H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                  复制图片
                </button>
                <button class="btn" id="btn-save">
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2.5v7.5m0 0 3-3m-3 3-3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11.5v1A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                  保存 PNG
                </button>
              </div>
            </div>

            <!-- 右：预览大卡 + 历史 -->
            <div class="encode-right">
              <div class="qr-card">
                <div class="qr-well" id="stage">
                  <div class="qr-art" aria-live="polite">
                    <canvas id="canvas" width="256" height="256"></canvas>
                  </div>
                  <div class="qr-empty" id="qr-empty">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.5"/><path d="M13.5 13.5h3v3h-3zM17.5 17.5h3v3h-3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                    <span>输入内容实时生成</span>
                  </div>
                </div>
                <div class="qr-meta mono" id="qr-meta"></div>
              </div>

              <div class="history">
                <div class="history-head">
                  最近生成
                  <span class="history-tip">点击恢复</span>
                </div>
                <div class="history-list" id="history"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- ================= 解码页签 ================= -->
        <section class="panel" id="panel-decode" role="tabpanel" aria-label="解码">
          <div class="decode-actions">
            <button class="btn primary" id="btn-clip">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2" y="4.75" width="9" height="8.75" rx="1.75" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 4.5V3.6c0-.6.2-1.1.6-1.5.4-.4.9-.6 1.5-.6h2.9c.6 0 1.1.2 1.5.6.4.4.6.9.6 1.5v2.9c0 .6-.2 1.1-.6 1.5-.4.4-.9.6-1.5.6h-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              剪贴板图片
            </button>
            <button class="btn" id="btn-file">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.5 2H4.75A1.75 1.75 0 0 0 3 3.75v8.5A1.75 1.75 0 0 0 4.75 14h6.5A1.75 1.75 0 0 0 13 12.25V5.5L9.5 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.5 2v3.5H13" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              本地图片
            </button>
            <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp" hidden />
          </div>
          <div class="decode-grid">
            <div class="preview" id="preview">
              <div class="preview-empty">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M14.5 9.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" stroke="currentColor" stroke-width="1.5"/><path d="m6 17 4.2-4.2c.5-.5 1.3-.5 1.8 0L16.5 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                <span>选择图片来源后解码</span>
              </div>
            </div>
            <div class="result">
              <div class="result-head">
                <span class="result-label">识别结果</span>
                <button class="btn primary btn-copy-text" id="btn-copy-text" disabled>
                  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.75" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.25A1.75 1.75 0 0 0 8.75 1.5h-5A1.75 1.75 0 0 0 2 3.25v5A1.75 1.75 0 0 0 3.75 10H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                  复制文本
                </button>
              </div>
              <div class="result-text placeholder" id="result-text">等待图片…</div>
            </div>
          </div>
        </section>
      </main>

      <footer class="app-foot">
        <span>生成 qrcode-generator · 解码 jsQR</span>
        <span class="foot-sep">·</span>
        <span>全部离线本地运行</span>
      </footer>
    </div>
    <script src="assets/js/vendor/qrcode.min.js"></script>
    <script src="assets/js/vendor/jsQR.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
