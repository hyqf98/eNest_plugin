<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>正则工作台</title>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <main class="regex-app">
      <header class="topbar">
        <div class="brand">
          <h1>正则工作台</h1>
          <span class="sub">输入即时匹配 · 分组 · 替换</span>
        </div>
        <div class="toolbar">
          <button id="toggle-snippets" class="shell-only" aria-expanded="true">模板库</button>
          <button id="toggle-sheet" class="shell-only" aria-expanded="false">速查表</button>
        </div>
      </header>

      <div class="workbench">
        <!-- 左栏：模板库 + 表达式 + 标志位 + 替换 -->
        <section class="pane pane-input" aria-label="表达式与选项">
          <div class="field">
            <label for="pattern">正则表达式</label>
            <div class="pattern-row">
              <div class="pattern-delimiter" aria-hidden="true">/</div>
              <textarea id="pattern" rows="2" spellcheck="false" placeholder="(\d{4})-(\d{2})-(\d{2})"></textarea>
              <div class="pattern-delimiter" aria-hidden="true">/</div>
            </div>
            <div id="pattern-error" class="error-bar" role="alert" hidden></div>
          </div>

          <div class="field">
            <label for="flags">标志位</label>
            <div id="flags" class="flags" role="group" aria-label="匹配标志"></div>
          </div>

          <div class="field">
            <label for="samples">测试文本 <span id="match-count" class="mono"></span></label>
            <div class="sample-wrap">
              <textarea id="samples" rows="7" spellcheck="false" placeholder="粘贴一段文本，或点击「填入示例」"></textarea>
              <div id="sample-highlight" class="sample-highlight mono" aria-hidden="true"></div>
            </div>
            <button id="fill-sample" class="ghost sample-fill">填入示例</button>
          </div>

          <div class="field">
            <label for="replacement">替换表达式 <span class="label-hint">支持 $1 与 $&lt;name&gt;</span></label>
            <div class="replace-row">
              <input id="replacement" class="mono" spellcheck="false" placeholder="$<y>年$<m>月$<d>日" />
              <button id="copy-result" disabled>复制结果</button>
            </div>
            <div id="replace-output" class="replace-output mono" aria-live="polite"></div>
          </div>
        </section>

        <!-- 右栏：匹配高亮预览 + 匹配列表 + 分组 -->
        <section class="pane pane-result" aria-label="匹配结果">
          <div class="result-head">
            <h2>匹配预览</h2>
            <span id="run-stats" class="mono" role="status"></span>
          </div>
          <div id="highlight-view" class="highlight-view mono" tabindex="0" aria-label="匹配高亮预览"></div>

          <div class="result-split">
            <section class="result-panel">
              <h2>匹配列表 <span id="match-badge" class="badge"></span></h2>
              <ol id="match-list" class="match-list"></ol>
            </section>
            <section class="result-panel">
              <h2>捕获分组 <span id="group-which" class="badge"></span></h2>
              <div id="groups" class="groups"></div>
            </section>
          </div>
        </section>
      </div>

      <!-- 模板库抽屉（桌面形态） -->
      <aside class="drawer drawer-left" id="snippets" aria-label="正则模板库" hidden>
        <div class="drawer-head">
          <h2>模板库</h2>
          <button id="close-snippets" aria-label="关闭模板库">×</button>
        </div>
        <div class="drawer-body" id="template-list"></div>
      </aside>

      <!-- 速查表抽屉（桌面形态） -->
      <aside class="drawer drawer-right" id="sheet" aria-label="正则速查表" hidden>
        <div class="drawer-head">
          <h2>正则速查表</h2>
          <button id="close-sheet" aria-label="关闭速查表">×</button>
        </div>
        <div class="drawer-body" id="cheatsheet"></div>
      </aside>
    </main>

    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
