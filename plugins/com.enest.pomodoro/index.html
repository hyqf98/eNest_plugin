<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>番茄钟</title>
    <!-- 壳子主题 token（--bg/--surface/--text/--accent…）；独立打开时落到下方 html 级兜底 -->
    <link rel="stylesheet" href="enest://plugin/com.enest.pomodoro/__enest_theme.css" />
    <style>
      /* ============ token 层 ============
       * 兜底写在 html（specificity 低于注入 css 的 :root，主题包可正常覆盖）；
       * :root 内为插件私有变量（环形色 / 排印 / 节奏），不与注入 token 重名。 */
      html {
        color-scheme: dark;
        --bg: #17191b;
        --surface: #202326;
        --surface-2: #292d31;
        --surface-3: #33383d;
        --border: rgba(242, 243, 243, 0.09);
        --border-strong: rgba(242, 243, 243, 0.16);
        --text: #f2f3f3;
        --text-2: #adb3b8;
        --text-3: #7e878f;
        --accent: #e98654;
        --ok: #77bfa4;
        --danger: #e79589;
      }
      :root {
        --focus-c: #5b8cff;                                  /* 专注段 accent */
        --break-c: #3ddc97;                                  /* 休息段绿 */
        --focus-ink: #0b1220;                                /* 专注实底按钮文字 */
        --break-ink: #06180f;                                /* 休息实底按钮文字 */
        --focus-soft: color-mix(in srgb, var(--focus-c) 14%, transparent);
        --break-soft: color-mix(in srgb, var(--break-c) 14%, transparent);
        --ring: color-mix(in srgb, var(--focus-c) 60%, transparent);
        --ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Cascadia Mono",
          "Roboto Mono", monospace;
        --ease: cubic-bezier(0.2, 0.7, 0.25, 1);
        --t: 140ms;                 /* 统一过渡节奏 */
      }
      /* 形态变量挂在 .timer-zone（容器查询可命中的后代节点）向下继承 */
      .timer-zone {
        --ring-d: 200px;            /* 窄形态表盘直径 */
        --time-fs: 40px;            /* 中央 mm:ss 字号 */
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--ui);
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      ::selection { background: var(--focus-soft); }
      :where(button, input):focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ============ 页眉 + 今日徽标 ============ */
      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; color: var(--focus-c); }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .today-badge {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--focus-soft);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--focus-c) 26%, transparent);
        font-size: 11px;
        color: color-mix(in srgb, var(--focus-c) 78%, var(--text));
        white-space: nowrap;
      }
      .today-badge b {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: color-mix(in srgb, var(--focus-c) 92%, var(--text));
      }

      /* ============ 环形表盘 ============ */
      .timer-zone {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
      }
      .ring-wrap {
        position: relative;
        width: var(--ring-d);
        height: var(--ring-d);
        filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--focus-c) 14%, transparent));
        transition: filter 200ms var(--ease);
      }
      /* 休息段：环境光切绿（随 #ring 的 .break 类联动，200ms 过渡） */
      .ring-wrap:has(.ring-fg.break) {
        filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--break-c) 13%, transparent));
      }
      .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
      .ring-bg {
        stroke: var(--surface-2);
        transition: stroke 200ms var(--ease);
      }
      .ring-fg {
        stroke: var(--focus-c);
        transition: stroke-dashoffset 0.25s linear, stroke 200ms var(--ease);
      }
      .ring-fg.break { stroke: var(--break-c); }
      .ring-center {
        position: absolute;
        inset: 15%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
      .phase {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        color: var(--text-2);
        letter-spacing: 0.14em;
      }
      .phase .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--focus-c);
        transition: background-color 200ms var(--ease);
      }
      .ring-wrap:has(.ring-fg.break) .phase .dot { background: var(--break-c); }
      .time {
        font-family: var(--mono);
        font-size: var(--time-fs);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        line-height: 1.1;
        color: var(--text);
      }
      .cycle {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--text-3);
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
      }

      /* ============ 控制行：主实底（开始/暂停）+ 幽灵图标钮（重置/跳过） ============ */
      .controls {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px 4px;
      }
      #btn-toggle {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        appearance: none;
        border: 0;
        height: 40px;
        border-radius: 12px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        cursor: pointer;
        background: var(--focus-c);
        color: var(--focus-ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 2px 12px color-mix(in srgb, var(--focus-c) 30%, transparent);
        transition: filter var(--t) var(--ease), transform var(--t) var(--ease),
          background-color var(--t) var(--ease), color var(--t) var(--ease),
          box-shadow var(--t) var(--ease);
      }
      #btn-toggle:hover { filter: brightness(1.06); }
      #btn-toggle:active {
        transform: translateY(1px);
        box-shadow: inset 0 1px 2px rgba(8, 10, 12, 0.3);
      }
      /* 休息段配色（focus→break 200ms 环色/按钮同步过渡） */
      #btn-toggle.break { background: var(--break-c); color: var(--break-ink); }
      #btn-toggle.break:hover { filter: brightness(1.06); }
      /* 运行中：幽灵描边态（暂停入口）；置于 .break 之后，运行态优先接管外观 */
      #btn-toggle.running {
        background: transparent;
        color: var(--focus-c);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--focus-c) 55%, transparent);
      }
      #btn-toggle.running:hover {
        background: var(--focus-soft);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--focus-c) 70%, transparent);
      }
      #btn-toggle.running.break {
        background: transparent;
        color: var(--break-c);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--break-c) 55%, transparent);
      }
      #btn-toggle.running.break:hover {
        background: var(--break-soft);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--break-c) 70%, transparent);
      }
      #btn-toggle svg { flex: none; }
      #btn-toggle .ic-pause { display: none; }
      #btn-toggle.running .ic-play { display: none; }
      #btn-toggle.running .ic-pause { display: block; }

      .ghost-btn {
        appearance: none;
        flex: none;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        padding: 0;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-2);
        cursor: pointer;
        transition: color var(--t) var(--ease), border-color var(--t) var(--ease),
          background-color var(--t) var(--ease), transform var(--t) var(--ease);
      }
      .ghost-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
        background: var(--surface-2);
      }
      .ghost-btn:active { transform: translateY(1px); }

      /* ============ 设置行 ============ */
      .settings {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 50%, var(--bg));
      }
      .field {
        display: flex;
        align-items: baseline;
        gap: 7px;
        font-size: 11.5px;
        color: var(--text-2);
      }
      .field input[type="number"] {
        width: 58px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        border-radius: 9px;
        padding: 5px 4px;
        font-family: var(--mono);
        font-size: 13px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        outline: none;
        transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
      }
      .field input[type="number"]:hover { border-color: var(--border-strong); }
      .field input[type="number"]:focus {
        border-color: color-mix(in srgb, var(--focus-c) 60%, transparent);
        box-shadow: 0 0 0 3px var(--focus-soft);
      }
      /* 去原生 number spinner */
      .field input[type="number"]::-webkit-outer-spin-button,
      .field input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .divider { width: 1px; height: 16px; background: var(--border); }

      .hint {
        flex: none;
        padding: 6px 16px 0;
        font-size: 10.5px;
        color: var(--text-3);
        text-align: center;
        min-height: 0;
        transition: opacity 200ms var(--ease);
      }
      .hint:empty { display: none; }
      footer {
        flex: none;
        padding: 7px 16px 9px;
        font-size: 10.5px;
        color: var(--text-3);
        text-align: center;
      }

      /* ============ 双形态响应式（容器查询优先，viewport 兜底） ============
       * 窄容器（≤740px，Quick 内嵌 ~706px）：表盘 200px 居中，首屏 ~480px 内；
       * 宽容器（>740px，固定主窗）：表盘 240px / mm:ss 48px，控制与输入适度放大。 */
      @supports (container-type: inline-size) {
        .app { container-type: inline-size; container-name: app; }
        @container app (min-width: 741px) {
          .timer-zone {
            --ring-d: 240px;
            --time-fs: 48px;
          }
          header { padding: 12px 20px; }
          h1 { font-size: 14px; }
          .timer-zone { padding: 14px 20px 10px; }
          .phase { font-size: 12px; }
          .cycle { font-size: 11px; }
          .controls { padding: 0 20px 6px; gap: 10px; }
          #btn-toggle { height: 44px; font-size: 14px; }
          .ghost-btn { width: 44px; height: 44px; }
          .settings { padding: 12px 20px; gap: 22px; }
          .field input[type="number"] { width: 66px; }
          .hint { padding: 7px 20px 0; }
          footer { padding: 8px 20px 10px; }
        }
      }
      /* 无容器查询兜底（旧内核）：viewport 断点与容器断点一致 */
      @media (min-width: 741px) {
        .timer-zone {
          --ring-d: 240px;
          --time-fs: 48px;
        }
        header { padding: 12px 20px; }
        h1 { font-size: 14px; }
        .timer-zone { padding: 14px 20px 10px; }
        .phase { font-size: 12px; }
        .cycle { font-size: 11px; }
        .controls { padding: 0 20px 6px; gap: 10px; }
        #btn-toggle { height: 44px; font-size: 14px; }
        .ghost-btn { width: 44px; height: 44px; }
        .settings { padding: 12px 20px; gap: 22px; }
        .field input[type="number"] { width: 66px; }
        .hint { padding: 7px 20px 0; }
        footer { padding: 8px 20px 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 内联 SVG 图标（stroke 1.5）：tomato / play / pause / reset / skip -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="ic-tomato-def">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13.5" r="7" />
            <path d="M12 6.5c.9-1.2 2.3-1.9 4-2-.2 1.5-1 2.7-2.3 3.3" />
            <path d="M12 6.5C11.1 5.3 9.7 4.6 8 4.6c.2 1.5 1 2.7 2.3 3.3" />
          </svg>
        </g>
        <g id="ic-play-def">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 5.8v12.4c0 .8.9 1.3 1.6.9l9.8-6.2c.6-.4.6-1.4 0-1.8L9.6 4.9C8.9 4.5 8 5 8 5.8z" />
          </svg>
        </g>
        <g id="ic-pause-def">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5.5v13M15 5.5v13" />
          </svg>
        </g>
        <g id="ic-reset-def">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 5.6A7 7 0 0 1 18.6 9" />
            <path d="M19.4 4.2v5h-5" />
            <path d="M16 18.4A7 7 0 0 1 5.4 15" />
            <path d="M4.6 19.8v-5h5" />
          </svg>
        </g>
        <g id="ic-skip-def">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 6.2v11.6c0 .8.9 1.3 1.6.9l8.4-5.4V17c0 .6.4 1 1 1s1-.4 1-1V7c0-.6-.4-1-1-1s-1 .4-1 1v3.7L6.6 5.3C5.9 4.9 5 5.4 5 6.2z" />
          </svg>
        </g>
      </defs>
    </svg>

    <div class="app">
      <header>
        <div class="brand" aria-hidden="true">
          <svg width="17" height="17"><use href="#ic-tomato-def" /></svg>
        </div>
        <h1>番茄钟</h1>
        <div class="today-badge" title="今日完成番茄数">今日 <b id="today">0</b> 🍅</div>
      </header>

      <div class="timer-zone">
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="12" />
            <circle class="ring-fg" id="ring" cx="60" cy="60" r="52" fill="none" stroke-width="12"
              stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0" />
          </svg>
          <div class="ring-center">
            <div class="phase"><span class="dot" aria-hidden="true"></span><span id="phase">专注</span></div>
            <div class="time" id="time">25:00</div>
            <div class="cycle" id="cycle">第 1 轮</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="ghost-btn" id="btn-reset" title="重置本阶段" aria-label="重置本阶段">
          <svg width="16" height="16"><use href="#ic-reset-def" /></svg>
        </button>
        <button id="btn-toggle">
          <svg class="ic-play" width="14" height="14" aria-hidden="true"><use href="#ic-play-def" /></svg>
          <svg class="ic-pause" width="14" height="14" aria-hidden="true"><use href="#ic-pause-def" /></svg>
          <span class="btn-label">开始</span>
        </button>
        <button class="ghost-btn" id="btn-skip" title="跳过本阶段" aria-label="跳过本阶段">
          <svg width="16" height="16"><use href="#ic-skip-def" /></svg>
        </button>
      </div>

      <div class="settings">
        <div class="field">
          <label for="focus-min">专注</label>
          <input type="number" id="focus-min" min="5" max="90" step="1" value="25" />
          <span>分钟</span>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <div class="field">
          <label for="break-min">休息</label>
          <input type="number" id="break-min" min="1" max="30" step="1" value="5" />
          <span>分钟</span>
        </div>
      </div>

      <div class="hint" id="hint"></div>
      <footer>专注结束自动休息 · 休息结束自动专注 · 后台持续计时</footer>
    </div>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
