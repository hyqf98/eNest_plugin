<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>番茄钟</title>

    <style>
      :root {
        --line: var(--border, #e0e5e3);
        --paper: var(--surface, #fff);
        --muted: var(--text-2, #77847e);
        --focus: var(--accent, #598774);
      }
      body {
        overflow: hidden;
      }
      button {
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: inherit;
        padding: 8px 12px;
      }
      button:hover {
        background: var(--surface-2, #e8eeeb);
      }
      input,
      select {
        background: var(--paper);
        color: inherit;
        border: 1px solid var(--line);
        padding: 8px;
        border-radius: 7px;
        min-width: 0;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 20px 25px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: -0.4px;
      }
      header span {
        flex: 1;
        color: var(--muted);
        font-size: 12px;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(340px, 1fr) minmax(300px, 0.85fr);
        flex: 1;
        min-height: 0;
      }
      .focus-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: auto;
        padding: 28px 25px 18px;
      }
      .task-input {
        width: min(380px, 100%);
        text-align: center;
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
      }
      .phase-tabs {
        display: flex;
        gap: 15px;
        font-size: 12px;
        color: var(--muted);
        padding: 18px;
      }
      .phase-tabs .active {
        color: var(--focus);
        font-weight: 600;
      }
      .clock {
        width: 245px;
        height: 245px;
        position: relative;
        margin: 6px 0 20px;
      }
      .clock svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .track {
        stroke: var(--line);
      }
      .progress {
        stroke: var(--focus);
        transition: stroke-dashoffset 1s linear;
      }
      .clock-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      #time {
        font-size: 48px;
        font-weight: 500;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
      }
      #status {
        font-size: 12px;
        color: var(--muted);
      }
      #cycle {
        font-size: 11px;
        color: var(--muted);
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .primary {
        background: var(--focus);
        color: white;
        min-width: 145px;
        font-weight: 600;
        padding: 12px 20px;
      }
      .primary:hover {
        background: var(--focus);
        filter: brightness(1.05);
      }
      .presets {
        display: flex;
        gap: 8px;
        margin: 22px 0 14px;
      }
      .presets button {
        border: 1px solid var(--line);
        font-size: 12px;
      }
      .configuration {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .configuration label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      .configuration input {
        width: 57px;
        padding: 5px;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        line-height: 1.8;
        margin-top: 16px;
        max-width: 370px;
      }
      .journal {
        border-left: 1px solid var(--line);
        padding: 25px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .journal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .journal h2 {
        font-size: 16px;
        margin: 0;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 23px 0;
      }
      .stats b {
        display: block;
        font-size: 25px;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .stats span {
        font-size: 10px;
        color: var(--muted);
      }
      .week {
        display: flex;
        gap: 9px;
        height: 90px;
        align-items: end;
        border-bottom: 1px solid var(--line);
        padding: 0 6px 18px;
        margin-bottom: 20px;
      }
      .day {
        flex: 1;
        position: relative;
        height: 100%;
        display: flex;
        align-items: end;
        justify-content: center;
      }
      .bar {
        width: 70%;
        background: color-mix(in srgb, var(--focus) 25%, transparent);
        border-radius: 4px 4px 0 0;
        min-height: 3px;
      }
      .day.today .bar {
        background: var(--focus);
      }
      .day span {
        position: absolute;
        bottom: -16px;
        font-size: 10px;
        color: var(--muted);
      }
      #records {
        overflow: auto;
        flex: 1;
      }
      .record {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .record .body {
        flex: 1;
        min-width: 0;
      }
      .record-title {
        font-size: 13px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .record-meta {
        font-size: 10px;
        color: var(--muted);
        margin-top: 5px;
      }
      .record button {
        font-size: 11px;
        padding: 5px;
      }
      .record-time {
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        padding: 35px 8px;
        text-align: center;
        color: var(--muted);
        line-height: 1.8;
        font-size: 12px;
      }
      .quick-today {
        font-size: 11px;
        color: var(--muted);
        margin-top: 15px;
      }
      dialog form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 270px;
      }
      dialog label {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      dialog .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      [data-mode='quick'] header {
        padding: 10px 15px;
        border: 0;
      }
      [data-mode='quick'] h1 {
        font-size: 14px;
      }
      [data-mode='quick'] .workspace {
        grid-template-columns: 1fr;
      }
      [data-mode='quick'] .focus-panel {
        padding: 0 15px 15px;
      }
      [data-mode='quick'] .clock {
        height: 175px;
        width: 175px;
        margin: 0 0 9px;
      }
      [data-mode='quick'] #time {
        font-size: 39px;
      }
      [data-mode='quick'] .phase-tabs {
        padding: 10px;
      }
      [data-mode='quick'] .presets {
        margin: 13px 0 10px;
      }
      [data-mode='quick'] .hint {
        margin-top: 9px;
      }
      [data-mode='quick'] .primary {
        padding: 9px 18px;
      }
      [data-mode='quick'] .progress {
        transition: none;
      }
      @media (max-width: 850px) {
        [data-mode='shell'] .workspace {
          grid-template-columns: 1fr;
          overflow: auto;
        }
        [data-mode='shell'] .journal {
          border-left: 0;
          border-top: 1px solid var(--line);
          min-height: 390px;
        }
        [data-mode='shell'] .focus-panel {
          overflow: visible;
        }
      }
      :root[data-anim='low'] .progress {
        transition: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>番茄钟</h1>
        <span class="shell-only">一次只做一件事</span
        ><button data-open-settings>偏好设置</button>
      </header>
      <main class="workspace">
        <section class="focus-panel">
          <input
            id="task"
            class="task-input"
            maxlength="500"
            placeholder="这一次，想专注完成什么？"
            aria-label="专注任务"
          />
          <div class="phase-tabs">
            <span data-phase="focus">专注</span
            ><span data-phase="break">短休息</span
            ><span data-phase="longBreak">长休息</span>
          </div>
          <div class="clock">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle
                class="track"
                cx="60"
                cy="60"
                r="54"
                fill="none"
                stroke-width="2"
              ></circle>
              <circle
                class="progress"
                id="ring"
                cx="60"
                cy="60"
                r="54"
                fill="none"
                stroke-width="3"
                stroke-linecap="round"
                stroke-dasharray="339.292"
              ></circle>
            </svg>
            <div class="clock-center">
              <span id="status">准备开始</span><span id="time">25:00</span
              ><span id="cycle">第 1 轮</span>
            </div>
          </div>
          <div class="controls">
            <button id="stop" title="停止本次计时">停止</button
            ><button id="toggle" class="primary">开始专注</button
            ><button id="skip" title="跳过阶段，不计入完成">跳过</button>
          </div>
          <div class="presets">
            <button data-preset="25,5">25 / 5 经典</button
            ><button data-preset="50,10">50 / 10 深度</button
            ><button data-preset="15,3">15 / 3 短冲刺</button>
          </div>
          <div class="configuration">
            <label
              >专注<input
                id="focus-min"
                type="number"
                min="1"
                max="180"
                value="25"
              />分</label
            ><label
              >短休息<input
                id="break-min"
                type="number"
                min="1"
                max="60"
                value="5"
              />分</label
            >
          </div>
          <div class="hint" id="hint">
            关闭插件标签后继续计时。退出 eNest 后暂停，重启可继续。<br />Space
            开始 / 暂停
          </div>
          <div class="quick-today quick-only" id="quick-today"></div>
        </section>
        <aside class="journal shell-only">
          <div class="journal-head">
            <h2>专注记录</h2>
            <button id="export">导出 CSV</button>
          </div>
          <div class="stats">
            <div><b id="today-count">0</b><span>今日完成</span></div>
            <div><b id="today-min">0</b><span>今日分钟</span></div>
            <div><b id="week-count">0</b><span>近七天完成</span></div>
          </div>
          <div class="week" id="week"></div>
          <div id="legacy" class="small" hidden></div>
          <div id="records"></div>
        </aside>
      </main>
    </div>
    <dialog id="record-dialog">
      <form id="record-form">
        <h3>编辑专注记录</h3>
        <label>任务<input id="record-task" maxlength="500" /></label
        ><label
          >实际专注分钟<input
            id="record-min"
            type="number"
            min="0"
            max="180"
            step="0.5" /></label
        ><label
          ><span
            ><input id="record-counted" type="checkbox" /> 计入完成统计</span
          ></label
        >
        <div class="actions">
          <button type="button" id="cancel-edit">取消</button
          ><button class="primary">保存</button>
        </div>
      </form>
    </dialog>


    <script type="module" src="./src/entry.js"></script>
  </body>
</html>
