name: release-dsh-runtime

# DSH 原生运行时独立发版：与插件发版解耦，仅推送 dsh-runtime-v<DSH_VERSION> 标签时触发。
# 运行时归档是 dsh 插件首启自下载的下载源（升级服务按资产名扫描本仓库所有 Release），
# 只有 DSH 版本变更时才需要发新标签；插件常规发版不再重打、重传约 543MB 的运行时资产。
on:
  push:
    tags: ['dsh-runtime-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '运行时发布标签（须已存在，如 dsh-runtime-v0.2.0-rc.2）'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve and validate immutable runtime source
        id: source
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { appendFileSync } = require('node:fs')
          const ref = `refs/tags/${process.env.RELEASE_TAG}`
          execFileSync('git', ['check-ref-format', ref])
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const output = execFileSync('git', ['ls-remote', '--exit-code', 'origin', ref, `${ref}^{}`], { encoding: 'utf8' })
          const refs = new Map(output.trim().split(/\r?\n/).map(line => {
            const [sha, name] = line.split(/\s+/)
            return [name, sha]
          }))
          if ((refs.get(`${ref}^{}`) || refs.get(ref)) !== head) {
            throw new Error('Runtime tag does not match the checked-out source')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${head}\n`)
          console.log(`Resolved ${ref} to ${head}`)
          NODE
      - name: Verify tag matches the DSH runtime contract
        run: |
          node --input-type=module <<'NODE'
          import { DSH_VERSION } from './plugins/dsh/scripts/runtime-contract.mjs'
          const expected = `dsh-runtime-v${DSH_VERSION}`
          if (process.env.RELEASE_TAG !== expected) {
            throw new Error(`Runtime tag must be ${expected} to match the pinned DSH_VERSION`)
          }
          NODE

  pack:
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ endsWith(matrix.platform, '-arm64') && 'arm64' || 'x64' }}
      - name: Verify native runtime architecture
        env:
          RUNTIME_TARGET: ${{ matrix.platform }}
        run: node -e "if (process.platform + '-' + process.arch !== process.env.RUNTIME_TARGET) throw new Error('Runner platform or architecture mismatch')"
      - name: Install deps
        run: npm ci
      - name: Build native DSH runtime asset
        run: node plugins/dsh/scripts/pack-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-${{ matrix.platform }}
          path: |
            dist/dsh-runtime-*.tgz
            dist/dsh-runtime-*.tgz.sha256
          if-no-files-found: error

  release:
    needs: [resolve-source, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Collect native DSH runtime assets
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-runtime-*
          path: dist
          merge-multiple: true

      - name: Verify runtime tag still points to this build
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const ref = `refs/tags/${process.env.RELEASE_TAG}`
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const output = execFileSync('git', ['ls-remote', '--exit-code', 'origin', ref, `${ref}^{}`], { encoding: 'utf8' })
          const refs = new Map(output.trim().split(/\r?\n/).map(line => {
            const [sha, name] = line.split(/\s+/)
            return [name, sha]
          }))
          if ((refs.get(`${ref}^{}`) || refs.get(ref)) !== head) {
            throw new Error('Runtime tag moved; refuse to publish stale runtime artifacts')
          }
          console.log(`Publishing ${ref} from ${head}`)
          NODE

      # 运行时 Release 只承载 tgz 与 sha256 边车；不携带插件包、registry 或媒体资产。
      # prerelease 使其不进入 /releases/latest，避免顶替插件市场索引（registry*.json）；
      # dsh 升级服务按资产名扫描所有非 draft Release，prerelease 不影响内核发现。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: DSH Runtime ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          files: |
            dist/*.tgz
            dist/*.sha256
          generate_release_notes: true
