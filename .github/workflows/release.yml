name: release-plugins

# 发版模型：推送代码分支不发版；只有推送 v* / plugins-* 标签才触发打包发布。
# 手动 dispatch 需显式填写发布标签（工作流不创建标签，标签需已存在）。
on:
  push:
    tags: ['v*', 'plugins-*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（须已存在，如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Validate plugin manifests
        run: node scripts/validate-manifests.mjs

      - name: Test market metadata and release assets
        run: node --test scripts/market-assets.test.mjs

      - name: Build registry
        run: node scripts/build-registry.mjs

      - name: Pack all plugins
        run: |
          mkdir -p dist
          for d in plugins/*/; do
            id=$(basename "$d")
            [ -f "$d/plugin.json" ] || continue
            node scripts/pack-plugin.mjs "$id" dist
          done

      - name: Prepare registry and media attachments
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/prepare-release.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Plugins ${{ inputs.tag || github.ref_name }}
          # 正式发布（非 draft）：进入 /releases/latest，壳子经
          # releases/latest/download/registry.json 拉取市场索引与安装包
          draft: false
          prerelease: false
          files: |
            dist/*
          generate_release_notes: true
