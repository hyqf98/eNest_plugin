name: release-plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Validate plugin manifests
        run: node scripts/validate-manifests.mjs

      - name: Test market metadata and release assets
        run: node --test scripts/market-assets.test.mjs

      - name: Build registry
        run: node scripts/build-registry.mjs

      - name: Pack all plugins
        run: |
          mkdir -p dist
          for d in plugins/*/; do
            id=$(basename "$d")
            [ -f "$d/plugin.json" ] || continue
            node scripts/pack-plugin.mjs "$id" dist
          done

      - name: Prepare registry and media attachments
        env:
          REPO: ${{ github.repository }}
          TAG: plugins-${{ github.run_number }}
        run: node scripts/prepare-release.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-${{ github.run_number }}
          name: Plugins ${{ github.run_number }}
          # 正式发布（非 draft）：进入 /releases/latest，壳子经
          # releases/latest/download/registry.json 拉取市场索引与安装包
          draft: false
          prerelease: false
          files: |
            dist/*
          generate_release_notes: true
