name: release-plugins

# 发版模型：推送代码分支不发版；只有推送 v* / plugins-* 标签才触发打包发布。
# 手动 dispatch 需显式填写发布标签（工作流不创建标签，标签需已存在）。
on:
  push:
    tags: ['v*', 'plugins-*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（须已存在，如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  dsh-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: npm ci
      - name: Build native DSH runtime asset
        run: node scripts/pack-dsh-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-${{ matrix.platform }}
          path: |
            dist/dsh-runtime-*.tgz
            dist/dsh-runtime-*.tgz.sha256
          if-no-files-found: error

  release:
    needs: dsh-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm ci

      - name: Validate source contracts
        run: npm run validate

      - name: Unit and package contract tests
        run: npm test

      - name: Build every plugin
        run: npm run build

      - name: Validate every distribution
        run: npm run validate:dist

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify every plugin under production CSP
        run: npm run capture:market -- --check

      - name: Pack validated distributions
        run: npm run pack -- --no-build --platform-variants

      - name: Build archive-backed registry
        run: npm run registry

      - name: Prepare registry and media attachments
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/prepare-release.mjs

      - name: Collect native DSH runtime assets
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-runtime-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Plugins ${{ inputs.tag || github.ref_name }}
          # 正式发布（非 draft）：进入 /releases/latest，壳子经
          # 优先拉取对应平台 registry-<os>-<arch>.json，旧壳仍用 registry.json
          draft: false
          prerelease: false
          files: |
            dist/*.enestplugin
            dist/*.tgz
            dist/*.sha256
            dist/*.svg
            dist/*.png
            dist/*.jpg
            dist/*.jpeg
            dist/*.webp
            dist/*.md
            dist/registry.json
            dist/registry-*.json
          generate_release_notes: true
