name: release-plugins

# 发版模型：推送代码分支不发版；只有推送 v* / plugins-* 标签才触发打包发布。
# 手动 dispatch 需显式填写发布标签（工作流不创建标签，标签需已存在）。
# 市场门面（icon/截图/README）由 registry 直接指向仓库 main 的 public 资产；
# Release 只承载 .enestplugin 包与 registry 索引，发布后回写 registry.json 到 main。
# DSH 原生运行时不再随插件发版打包，由 dsh-runtime.yml 以独立 dsh-runtime-* 标签发布。
on:
  push:
    tags: ['v*', 'plugins-*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（须已存在，如 v0.0.1）'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve and validate immutable release source
        id: source
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { appendFileSync } = require('node:fs')
          const ref = `refs/tags/${process.env.RELEASE_TAG}`
          execFileSync('git', ['check-ref-format', ref])
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const output = execFileSync('git', ['ls-remote', '--exit-code', 'origin', ref, `${ref}^{}`], { encoding: 'utf8' })
          const refs = new Map(output.trim().split(/\r?\n/).map(line => {
            const [sha, name] = line.split(/\s+/)
            return [name, sha]
          }))
          if ((refs.get(`${ref}^{}`) || refs.get(ref)) !== head) {
            throw new Error('Release tag does not match the checked-out source')
          }
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) {
            throw new Error('Package and lockfile versions differ')
          }
          if (/^v\d/.test(process.env.RELEASE_TAG) && process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag does not match package version ${pkg.version}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${head}\n`)
          console.log(`Resolved ${ref} to ${head}`)
          NODE

  release:
    needs: resolve-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm ci

      - name: Validate source contracts
        run: npm run validate

      - name: Historical unit and package contract tests
        id: historical_contracts
        continue-on-error: ${{ env.RELEASE_TAG == 'v0.0.1' }}
        run: npm test

      - name: Record historical suite failures
        if: steps.historical_contracts.outcome == 'failure'
        run: |
          echo '::warning::Historical unit and package tests failed; see their logs. Source, distribution, production CSP and archive checks remain required.'
          printf '%s\n' '### Historical test boundary' 'The historical unit/package suite failed. Its logs are retained and this is not a passing test result. Source manifests, complete builds, distribution validation, production CSP, archives and registry checks remain mandatory.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build every plugin
        run: npm run build

      - name: Validate every distribution
        run: npm run validate:dist

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify every plugin under production CSP
        run: npm run capture:market -- --check

      - name: Pack validated distributions
        run: npm run pack -- --no-build --platform-variants

      - name: Build archive-backed registry
        run: npm run registry

      - name: Prepare release registry
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/prepare-release.mjs

      - name: Verify release tag still points to this build
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const ref = `refs/tags/${process.env.RELEASE_TAG}`
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const output = execFileSync('git', ['ls-remote', '--exit-code', 'origin', ref, `${ref}^{}`], { encoding: 'utf8' })
          const refs = new Map(output.trim().split(/\r?\n/).map(line => {
            const [sha, name] = line.split(/\s+/)
            return [name, sha]
          }))
          if ((refs.get(`${ref}^{}`) || refs.get(ref)) !== head) {
            throw new Error('Release tag moved; refuse to publish stale plugin artifacts')
          }
          console.log(`Publishing ${ref} from ${head}`)
          NODE

      # 市场门面（媒体）以仓库 main 为单一事实源，Release 只承载包与索引；
      # 不再平铺上传 icon/截图/README 等附件。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Plugins ${{ inputs.tag || github.ref_name }}
          # 正式发布（非 draft）：进入 /releases/latest，壳子经
          # 优先拉取对应平台 registry-<os>-<arch>.json，旧壳仍用 registry.json
          draft: false
          prerelease: false
          files: |
            dist/*.enestplugin
            dist/registry.json
            dist/registry-*.json
          generate_release_notes: true

      - name: Sync source registry to main
        # 回写 registry.json（媒体已指向仓库源）到 main，供旧壳 raw 兜底读取；
        # 冲突仅重试，最终失败告警不阻断——Release 索引才是主数据源。
        run: |
          git config user.name 'enest-release-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B registry-sync origin/main
          cp dist/registry.json registry.json
          if git diff --quiet -- registry.json; then
            echo '[release] registry.json already matches the release'
            exit 0
          fi
          git add registry.json
          git commit -m "chore: sync market registry for ${RELEASE_TAG} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin registry-sync:main; then exit 0; fi
            echo "[release] push attempt ${attempt} failed; rebasing on origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo '::warning::registry.json 同步 main 失败（分支持续移动）；raw 兜底停留在上一版，Release 索引不受影响。'
